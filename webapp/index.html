<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Figo3D Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --hint: #8e8e93;
    --link: #2ea6ff;
    --button: #2ea6ff;
    --button-text: #ffffff;
    --secondary-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100vh; padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 14px 0; }
  header h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
  #tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: none; border-radius: 999px; padding: 8px 16px;
    background: var(--secondary-bg); color: var(--text); font-size: 14px; font-weight: 500;
  }
  .tab.active { background: var(--button); color: var(--button-text); }

  /* Kichik bo'limlar (subkategoriya) - bo'lim tugmalaridan bir oz kichikroq,
     shu bilan ikki daraja (Bo'lim / Kichik bo'lim) vizual jihatdan aniq
     ajralib turadi. */
  #subtabs { display: none; gap: 6px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  #subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    flex: none; border: 1.5px solid var(--secondary-bg); border-radius: 999px; padding: 5px 12px;
    background: transparent; color: var(--hint); font-size: 12.5px; font-weight: 500;
  }
  .subtab.active { background: var(--secondary-bg); color: var(--text); border-color: var(--secondary-bg); font-weight: 700; }

  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px; }
  .empty, .cart-empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 40px 20px; font-size: 15px; }

  .card { background: var(--secondary-bg); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card-img { aspect-ratio: 1 / 1; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .noimg { font-size: 34px; opacity: 0.5; }
  .noimg.big { font-size: 64px; padding: 60px 0; }
  .noimg.small { font-size: 20px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 10px; }
  .card-body { padding: 8px 10px 4px; flex: 1; }
  .card-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .card-price { font-size: 13px; color: var(--hint); }
  .card-action { padding: 8px 10px 10px; }
  .add-btn {
    width: 100%; border: none; border-radius: 10px; padding: 8px 0;
    background: var(--button); color: var(--button-text); font-size: 13px; font-weight: 600;
  }
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--button); border-radius: 10px; padding: 4px 6px; color: var(--button-text);
  }
  .stepper button {
    border: none; background: transparent; color: var(--button-text); font-size: 18px;
    width: 26px; height: 26px; line-height: 1;
  }
  .stepper span { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }

  #overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #overlay.hidden { display: none; }
  .screen { padding: 14px 16px 30px; }
  .screen-title { font-size: 19px; font-weight: 700; margin: 4px 0 16px; }

  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .gallery img { width: 100%; flex: none; scroll-snap-align: start; aspect-ratio: 1 / 1; object-fit: cover; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); opacity: 0.4; }
  .dot.active { opacity: 1; background: var(--button); }
  .detail-body { padding: 4px 16px 20px; }
  .detail-body h2 { font-size: 19px; margin: 6px 0 8px; }
  .detail-desc { font-size: 14.5px; color: var(--hint); line-height: 1.5; margin: 0 0 14px; white-space: pre-wrap; }
  .detail-price { font-size: 18px; font-weight: 700; }

  .cart-list { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px; }
  .cart-row { display: flex; align-items: center; gap: 10px; background: var(--secondary-bg); border-radius: 14px; padding: 8px; }
  .cart-row-img { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; }
  .cart-row-img img { width: 100%; height: 100%; object-fit: cover; }
  .cart-row-info { flex: 1; min-width: 0; }
  .cart-row-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .cart-row-price { font-size: 12.5px; color: var(--hint); margin-top: 2px; }
  .cart-total { padding: 18px 16px 8px; font-size: 16px; font-weight: 700; text-align: right; }
  .cart-hint {
    margin: 4px 16px 0; padding: 14px; border-radius: 14px; background: var(--secondary-bg);
    color: var(--text); font-size: 14px; line-height: 1.55; text-align: center;
  }
  .cart-hint b { color: var(--link); }

  .page-cta {
    display: block; width: 100%; border: none; border-radius: 14px;
    background: var(--button); color: var(--button-text); padding: 15px;
    font-size: 15.5px; font-weight: 700; margin: 18px 0 4px;
  }
  .page-cta:disabled { opacity: 0.55; }

  #toast {
    position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 50;
    background: #1c1c1e; color: #ffffff; padding: 13px 16px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.4; box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    transform: translateY(140%); transition: transform 0.25s ease;
  }
  #toast.show { transform: translateY(0); }

  /* ---------- Chap tomonlama menyu (28-avgust: "Profil / Mahsulotlar /
     Shaxsiy buyurtmalar / Savat / Buyurtmalar / Yangiliklar / Chat" so'rovi
     bilan qo'shildi) ---------- */
  #menu-toggle {
    position: fixed; top: 14px; left: 12px; z-index: 26; width: 38px; height: 38px;
    border: none; border-radius: 10px; background: var(--secondary-bg); color: var(--text);
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header { padding-left: 58px; }
  #sidebar-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 24;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  #sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: 78%; max-width: 300px; z-index: 25;
    background: var(--bg); box-shadow: 2px 0 18px rgba(0,0,0,0.2);
    transform: translateX(-100%); transition: transform 0.22s ease;
    overflow-y: auto; padding: 16px 0 20px;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar .sidebar-title { font-size: 17px; font-weight: 700; padding: 4px 18px 14px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px; width: 100%; border: none; background: transparent;
    color: var(--text); font-size: 15px; font-weight: 500; padding: 13px 18px; text-align: left;
  }
  .sidebar-item .ic { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-item:active { background: var(--secondary-bg); }

  /* ---------- Oddiy forma elementlari (Profil tahrirlash, Shaxsiy
     buyurtma formasi uchun) ---------- */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12.5px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
  .form-input, .form-textarea {
    width: 100%; border: none; border-radius: 12px; background: var(--secondary-bg); color: var(--text);
    padding: 13px 14px; font-size: 15px; font-family: inherit;
  }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-error { color: #ff3b30; font-size: 12.5px; margin-top: 6px; }
  .form-hint { font-size: 12px; color: var(--hint); margin: -6px 0 14px; line-height: 1.4; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .photo-pick-btn {
    width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--hint);
    background: transparent; color: var(--hint); font-size: 22px;
  }
  .info-card { background: var(--secondary-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .info-card .card-line { font-size: 13.5px; color: var(--hint); line-height: 1.6; }
  .info-card .card-line b { color: var(--text); }

  /* "🎯 Vazifalar" bo'limi (29-avgust) */
  .task-card { background: var(--secondary-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .task-card .task-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .task-card .task-line { font-size: 13px; color: var(--hint); line-height: 1.5; }
  .task-badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; margin-top: 8px; }
  .task-badge.wait { background: #fff3cd; color: #8a6d00; }
  .task-badge.ok { background: #d4edda; color: #1b7a34; }
  .task-badge.rejected { background: #fde2e1; color: #c1272d; }
  .task-btn { margin-top: 8px; border: none; border-radius: 10px; padding: 9px 16px; background: var(--button); color: var(--button-text); font-size: 13.5px; font-weight: 600; }
  .news-card { background: var(--secondary-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .news-card img { width: 100%; border-radius: 10px; margin-bottom: 8px; }
  .news-card .news-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
</style>
</head>
<body>
<button id="menu-toggle">☰</button>
<div id="sidebar-backdrop"></div>
<nav id="sidebar">
  <div class="sidebar-title">📋 Menyu</div>
  <div id="sidebar-items"></div>
</nav>
<div id="app">
  <header>
    <h1>🎁 Figo3D</h1>
    <div id="tabs"></div>
  </header>
  <div id="subtabs"></div>
  <main id="grid"></main>
  <div id="overlay" class="hidden"></div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  // MUHIM (foydalanuvchi so'rovi bilan soddalashtirildi): bu Mini App endi
  // FAQAT ikkita ishni qiladi - katalogni ko'rsatish va savatga mahsulot
  // qo'shish/miqdorini o'zgartirish. Buyurtma berish (checkout), profil,
  // buyurtmalar tarixi, shaxsiy buyurtma va aloqa - булар barchasi ENDI
  // Telegram CHATning o'zidagi pastki tugmalar orqali ishlaydi (ular
  // ancha ishonchli, chunki webview/JS'ga bog'liq emas). Savat bitta
  // umumiy ma'lumotlar bazasida saqlanadi, shuning uchun bu yerda
  // qo'shilgan mahsulot chatdagi "🛒 Savat" tugmasida ham darhol ko'rinadi.
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  function themeVar(name, fallback) {
    return (tg && tg.themeParams && tg.themeParams[name]) ? tg.themeParams[name] : fallback;
  }
  function applyTheme() {
    var root = document.documentElement.style;
    root.setProperty("--bg", themeVar("bg_color", "#ffffff"));
    root.setProperty("--text", themeVar("text_color", "#111111"));
    root.setProperty("--hint", themeVar("hint_color", "#8e8e93"));
    root.setProperty("--link", themeVar("link_color", "#2ea6ff"));
    root.setProperty("--button", themeVar("button_color", "#2ea6ff"));
    root.setProperty("--button-text", themeVar("button_text_color", "#ffffff"));
    root.setProperty("--secondary-bg", themeVar("secondary_bg_color", "#f4f4f5"));
  }
  applyTheme();
  if (tg) tg.onEvent("themeChanged", applyTheme);

  // ---------- Holat ----------
  var state = {
    categories: [], products: [], cart: {},
    detailProduct: null,
    profile: null, orders: null, announcements: null,
    // 29-avgust: to'lov endi Mini App ICHIDA (checkout/topup ko'rinishlari) -
    // pastdagi maydonlar shu oqim uchun.
    paymentInfo: "", // /api/config'dan (hamyon to'ldirishda bank rekvizitlari uchun)
    contactInfo: "", // /api/config'dan ("Operatorga yozish" ekranida ko'rsatiladi)
    checkoutForm: null, // {full_name, phone, address} - savat -> to'lov oralig'ida saqlanadi
    promo: null, // {code, discount_percent} - to'lov ekranida qo'llangan promo-kod
    topupPrefill: null, // to'lovda hamyon yetmagan summa - hamyon to'ldirish summasini oldindan to'ldirish uchun
  };
  var navStack = []; // bo'sh = katalog (grid) ko'rinishi

  function fmtPrice(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initDataStr() { return tg ? tg.initData : ""; }

  // Bitta joyda ko'rinadigan xato/ogohlantirish xabari - tarmoq/server
  // muammosi YUZ BERGANDA hech narsa ko'rsatmasdan "jim" qolib ketmaslik
  // uchun (aynan shu narsa avvalgi xato sababi edi: sekin/uxlab qolgan
  // Render server javob bermaganda hech qanday xabar chiqmasdi).
  var toastTimer = null;
  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 5000);
  }

  // MUHIM (29-avgust, "Telegram qotib qolyapti" muammosiga javoban): Mini App
  // uzoq vaqt fonda (ekran o'chgan/boshqa ilovaga o'tilgan) qolib ketsa,
  // o'sha payt "havoda" turgan (hali tugamagan) so'rov(lar) Telegram'ning
  // ichki WebView komponentini uyg'onishda qiynashi mumkin edi. Shuning
  // uchun endi HAR bir api() chaqiruvi pastdagi pendingControllers ro'yxatida
  // kuzatiladi va Mini App fonga o'tgan zahoti hammasi bekor qilinadi (pastga
  // qarang) - bu Telegram qotib qolish xavfini kamaytiradi (garchi bu asosan
  // Telegram'ning o'zidagi platforma darajasidagi xatti-harakat bo'lsa-da).
  var pendingControllers = [];
  function trackController(c) { if (c) pendingControllers.push(c); }
  function untrackController(c) {
    var idx = pendingControllers.indexOf(c);
    if (idx !== -1) pendingControllers.splice(idx, 1);
  }
  function abortAllPending() {
    pendingControllers.forEach(function (c) { try { c.abort(); } catch (e) {} });
    pendingControllers = [];
  }

  // {ok, status, data} qaytaradi - xato holatini ham chaqiruvchi o'zi ko'rib chiqishi mumkin.
  // Render'ning bepul tarifi uzoq ishlatilmasa "uxlab qoladi" va birinchi
  // so'rovga javob berish 30-60 soniyagacha cho'zilishi mumkin - shuning
  // uchun 45 soniyagacha kutamiz (darhol "ishlamayapti" deb hisoblamaymiz),
  // lekin abadiy osilib qolmasligi uchun shu muddatdan keyin to'xtatamiz.
  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (initDataStr()) headers["X-Telegram-Init-Data"] = initDataStr();
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    trackController(controller);
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 45000) : null;
    return fetch(path, Object.assign({}, opts, { headers: headers, signal: controller ? controller.signal : undefined }))
      .then(function (res) {
        if (timeoutId) clearTimeout(timeoutId);
        untrackController(controller);
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok, status: res.status, data: data };
        });
      })
      .catch(function (err) {
        if (timeoutId) clearTimeout(timeoutId);
        untrackController(controller);
        var isAbort = err && err.name === "AbortError";
        // Mini App o'zi fonga o'tgani sababli bekor qilingan so'rovlar uchun
        // xato xabari (toast) ko'rsatmaymiz - foydalanuvchi buni ko'rmaydi
        // ham, hech qanday xatolik yuz bermadi, shunchaki fonga o'tdi.
        if (isAbort && document.hidden) {
          return { ok: false, status: 0, data: { error: "backgrounded" } };
        }
        showToast(
          isAbort
            ? "Server javob bermayapti (uxlab qolgan bo'lishi mumkin). Biroz kutib, qaytadan urinib ko'ring."
            : "Internet aloqasida muammo. Qaytadan urinib ko'ring."
        );
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return { ok: false, status: 0, data: { error: "network" } };
      });
  }

  // Fonga o'tganda - kutayotgan barcha so'rovlarni bekor qilamiz. Qaytib
  // kelganda (agar 30 soniyadan ko'proq fonda qolgan bo'lsa) - savat va
  // sozlamalarni jimgina qaytadan yuklaymiz, shunda Telegram initData'ni
  // yangilagan bo'lsa, Mini App buni foydalanuvchi asilo sezmasdan darhol
  // qo'llaydi (aks holda "boshqa bo'limlarda yuklab bo'lmadi" xatosi butun
  // ilovani qayta ochguncha davom etardi).
  var hiddenSince = null;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      hiddenSince = Date.now();
      abortAllPending();
    } else if (hiddenSince) {
      var awayMs = Date.now() - hiddenSince;
      hiddenSince = null;
      if (awayMs > 30000) {
        loadCart().then(function () {
          if (currentView() === "grid") renderGrid();
          if (currentView() === "cart") render();
          updateMainButton();
        });
        loadConfig();
      }
    }
  });
  window.addEventListener("pagehide", abortAllPending);

  function photoUrl(fileId) { return "/api/photo/" + encodeURIComponent(fileId); }

  // ---------- Chap tomonlama menyu ----------
  // MUHIM (29-avgust, TUZATILDI): ILGARI "Chat" bosilganda shunchaki Mini
  // App'ni yopib (tg.close()), mijozni botning ORQADA turgan chatiga
  // qaytarardi - lekin pastki chat tugmalari olib tashlangandan keyin
  // (shu round'ning boshqa qismi) u yerda mijozdan erkin matnni ushlab
  // adminga yo'naltiradigan HECH QANDAY handler yo'q edi, shuning uchun
  // mijoz "murojaat yo'lay olmayapti" degan shikoyat qildi. Endi bu
  // to'g'ridan-to'g'ri Mini App ICHIDA ishlaydigan "Operatorga yozish"
  // formasiga almashtirildi (pastda VIEW_RENDERERS.contact) - xabar
  // serverga (/api/contact_message) yuboriladi va ADMINGA Telegram orqali
  // yetadi.
  var SIDEBAR_ITEMS = [
    { key: "profile", icon: "👤", label: "Profil" },
    { key: "grid", icon: "🗂", label: "Mahsulotlar" },
    { key: "tasks", icon: "🎯", label: "Vazifalar" },
    { key: "custom", icon: "🎨", label: "Shaxsiy buyurtmalar" },
    { key: "cart", icon: "🛒", label: "Savat" },
    { key: "orders", icon: "📦", label: "Buyurtmalar" },
    { key: "announcements", icon: "📰", label: "Yangiliklar" },
    { key: "contact", icon: "💬", label: "Operatorga yozish" },
  ];

  function renderSidebar() {
    var el = document.getElementById("sidebar-items");
    el.innerHTML = SIDEBAR_ITEMS.map(function (it) {
      return '<button class="sidebar-item" data-menu="' + it.key + '"><span class="ic">' + it.icon + '</span>' + it.label + '</button>';
    }).join("");
    el.querySelectorAll("[data-menu]").forEach(function (btn) {
      btn.onclick = function () { onSidebarSelect(btn.getAttribute("data-menu")); };
    });
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebar-backdrop").classList.add("open");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebar-backdrop").classList.remove("open");
  }
  document.getElementById("menu-toggle").onclick = function () {
    var sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains("open")) closeSidebar(); else openSidebar();
  };
  document.getElementById("sidebar-backdrop").onclick = closeSidebar;

  function onSidebarSelect(key) {
    closeSidebar();
    if (key === "grid") {
      navStack = [];
      render();
      return;
    }
    // "cart"/"profile"/"orders"/"custom"/"announcements"/"contact" -
    // hammasi bitta umumiy naqsh: navStack'ga qo'shiladi, VIEW_RENDERERS
    // orqali #overlay ichida ko'rsatiladi (xuddi mahsulot tafsiloti kabi).
    pushView(key);
  }
  renderSidebar();

  // ---------- Navigatsiya (grid -> detail -> orqaga, yoki grid -> cart -> orqaga) ----------
  function currentView() { return navStack.length ? navStack[navStack.length - 1] : "grid"; }
  function pushView(name) { navStack.push(name); render(); }
  function popView() { if (navStack.length) navStack.pop(); render(); }

  if (tg) {
    tg.BackButton.onClick(function () { popView(); });
  }

  var VIEW_RENDERERS = {}; // to'ldiriladi (pastda)

  function render() {
    var view = currentView();
    var overlay = document.getElementById("overlay");
    if (view === "grid") {
      overlay.classList.add("hidden");
      overlay.innerHTML = "";
      if (tg) tg.BackButton.hide();
    } else {
      overlay.classList.remove("hidden");
      if (tg) tg.BackButton.show();
      (VIEW_RENDERERS[view] || function () {})(overlay);
    }
    updateMainButton();
  }

  // ---------- Yuklash ----------
  function loadCatalog() {
    return api("/api/catalog").then(function (r) {
      state.categories = (r.data && r.data.categories) || [];
      state.products = (r.data && r.data.products) || [];
    });
  }
  function loadCart() {
    return api("/api/cart").then(function (r) {
      state.cart = {};
      if (r.ok) ((r.data && r.data.items) || []).forEach(function (i) { state.cart[i.product_id] = i.quantity; });
    });
  }
  function loadConfig() {
    // 29-avgust: hamyon to'ldirish ekranida bank rekvizitlarini ko'rsatish
    // uchun - xato bo'lsa ham botni to'xtatib qo'ymaymiz, faqat
    // rekvizitlar bo'sh qoladi (topup ekrani buni alohida ko'rsatadi).
    return api("/api/config").then(function (r) {
      if (r.ok) {
        state.paymentInfo = (r.data && r.data.payment_info) || "";
        state.contactInfo = (r.data && r.data.contact_info) || "";
      }
    });
  }

  // ---------- Katalog to'ri (Bo'lim -> ixtiyoriy Kichik bo'lim -> Mahsulotlar) ----------
  // MUHIM (27-avgust, "katalog ichida katalog" so'roviga javoban):
  // state.categories endi {name, subcategories: [...]} obyektlar ro'yxati
  // (avval oddiy matn ro'yxati edi) - /api/catalog javobi shunga mos
  // o'zgartirilgan (webapp_api.py'ga qarang).
  var activeCategory = null;
  var activeSubcategory = null; // null = "Hammasi" (kichik bo'lim tanlanmagan)

  function currentCategoryObj() {
    var matches = state.categories.filter(function (c) { return c.name === activeCategory; });
    return matches[0] || null;
  }

  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = "";
    state.categories.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.className = "tab" + (cat.name === activeCategory ? " active" : "");
      btn.textContent = cat.name;
      btn.onclick = function () {
        activeCategory = cat.name;
        activeSubcategory = null;
        renderTabs(); renderSubtabs(); renderGrid();
      };
      el.appendChild(btn);
    });
  }

  function renderSubtabs() {
    var el = document.getElementById("subtabs");
    var cat = currentCategoryObj();
    var subs = (cat && cat.subcategories) || [];
    if (!subs.length) {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    el.style.display = "flex";
    var chips = ['<button class="subtab' + (activeSubcategory === null ? " active" : "") + '" data-sub="">Hammasi</button>'];
    subs.forEach(function (s) {
      chips.push(
        '<button class="subtab' + (activeSubcategory === s ? " active" : "") + '" data-sub="' + escapeHtml(s) + '">' +
        escapeHtml(s) + '</button>'
      );
    });
    el.innerHTML = chips.join("");
    el.querySelectorAll("[data-sub]").forEach(function (btn) {
      btn.onclick = function () {
        activeSubcategory = btn.getAttribute("data-sub") || null;
        renderSubtabs(); renderGrid();
      };
    });
  }

  function renderGrid() {
    var el = document.getElementById("grid");
    el.innerHTML = "";
    var items = state.products.filter(function (p) {
      if (p.category !== activeCategory) return false;
      if (activeSubcategory !== null && p.subcategory !== activeSubcategory) return false;
      return true;
    });
    if (!items.length) {
      el.innerHTML = "<div class=\"empty\">Bu bo'limda hozircha mahsulot yo'q</div>";
      return;
    }
    items.forEach(function (p) {
      var qty = state.cart[p.id] || 0;
      var card = document.createElement("div");
      card.className = "card";
      var img = (p.photos && p.photos[0])
        ? '<img src="' + photoUrl(p.photos[0]) + '" loading="lazy">'
        : '<div class="noimg">🎁</div>';
      card.innerHTML =
        '<div class="card-img">' + img + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="card-price">' + fmtPrice(p.price) + " so'm</div>" +
        '</div>' +
        '<div class="card-action">' +
          (qty > 0
            ? '<div class="stepper"><button class="dec">−</button><span>' + qty + '</span><button class="inc">+</button></div>'
            : '<button class="add-btn">➕ Qo\'shish</button>') +
        '</div>';
      card.querySelector(".card-img").onclick = function () { openDetail(p); };
      card.querySelector(".card-name").onclick = function () { openDetail(p); };
      var addBtn = card.querySelector(".add-btn");
      if (addBtn) addBtn.onclick = function (e) { e.stopPropagation(); changeQty(p.id, 1); };
      var dec = card.querySelector(".dec");
      var inc = card.querySelector(".inc");
      if (dec) dec.onclick = function (e) { e.stopPropagation(); changeQty(p.id, -1); };
      if (inc) inc.onclick = function (e) { e.stopPropagation(); changeQty(p.id, 1); };
      el.appendChild(card);
    });
  }

  function changeQty(productId, delta) {
    var current = state.cart[productId] || 0;
    var next = Math.max(0, current + delta);
    if (next === 0) delete state.cart[productId]; else state.cart[productId] = next;
    if (currentView() === "grid") renderGrid();
    if (currentView() === "cart") render();
    updateMainButton();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

    api("/api/cart/set_qty", { method: "POST", body: JSON.stringify({ product_id: productId, quantity: next }) })
      .then(function (r) {
        if (r.ok && r.data.quantity > 0) state.cart[productId] = r.data.quantity;
        else if (r.ok) delete state.cart[productId];
        if (currentView() === "grid") renderGrid();
        if (currentView() === "cart") render();
        updateMainButton();
      });
  }

  function cartCount() { return Object.keys(state.cart).reduce(function (a, k) { return a + state.cart[k]; }, 0); }
  function cartSubtotal() {
    var total = 0;
    Object.keys(state.cart).forEach(function (pid) {
      var p = state.products.filter(function (x) { return x.id === Number(pid); })[0];
      if (p) total += p.price * state.cart[pid];
    });
    return total;
  }

  // ---------- MainButton ----------
  // Endi faqat ikkita ishni bajaradi: mahsulot tafsilotida "savatga
  // qo'shish" va katalogda "savatni ochish". Buyurtma berish, profil va
  // boshqa hammasi endi chatning o'zida (ishonchliroq) ishlaydi.
  function updateMainButton() {
    if (!tg) return;
    var view = currentView();
    if (view === "detail" && state.detailProduct) {
      var qty = state.cart[state.detailProduct.id] || 0;
      tg.MainButton.setText(qty > 0 ? ("✅ Savatda: " + qty + " ta — yana qo'shish") : "➕ Savatga qo'shish");
      tg.MainButton.show();
    } else if (view === "grid") {
      var c = cartCount();
      if (c > 0) { tg.MainButton.setText("🛒 Savat — " + c + " ta, " + fmtPrice(cartSubtotal()) + " so'm"); tg.MainButton.show(); }
      else tg.MainButton.hide();
    } else {
      tg.MainButton.hide();
    }
  }

  if (tg) {
    tg.MainButton.onClick(function () {
      // Himoya qatlami: kutilmagan xato chiqsa ham, tugma "qotib
      // qolmasligi" va foydalanuvchiga tushunarli xabar chiqishi uchun.
      try {
        var view = currentView();
        if (view === "detail" && state.detailProduct) { changeQty(state.detailProduct.id, 1); }
        else if (view === "grid") { pushView("cart"); }
      } catch (err) {
        console.error("MainButton bosilganda kutilmagan xatolik:", err);
        showToast("Kutilmagan xatolik yuz berdi. Qaytadan urinib ko'ring.");
      }
    });
  }

  // ---------- Mahsulot tafsiloti ----------
  function setupGalleryScroll(el) {
    var gallery = el.querySelector(".gallery");
    var dots = el.querySelectorAll(".dot");
    if (!gallery) return;
    gallery.addEventListener("scroll", function () {
      var idx = Math.round(gallery.scrollLeft / gallery.clientWidth);
      dots.forEach(function (d, i) { d.classList.toggle("active", i === idx); });
    });
  }

  function openDetail(p) {
    state.detailProduct = p;
    pushView("detail");
  }

  VIEW_RENDERERS.detail = function (el) {
    var p = state.detailProduct;
    var photos = (p.photos && p.photos.length) ? p.photos : [];
    var imagesHtml;
    if (photos.length) {
      imagesHtml = '<div class="gallery">' + photos.map(function (f) { return '<img src="' + photoUrl(f) + '">'; }).join("") + '</div>';
      if (photos.length > 1) {
        imagesHtml += '<div class="dots">' + photos.map(function (_, i) { return '<span class="dot' + (i === 0 ? " active" : "") + '"></span>'; }).join("") + '</div>';
      }
    } else {
      imagesHtml = '<div class="noimg big">🎁</div>';
    }
    var qty = state.cart[p.id] || 0;
    el.innerHTML =
      imagesHtml +
      '<div class="detail-body">' +
        '<h2>' + escapeHtml(p.name) + '</h2>' +
        '<p class="detail-desc">' + escapeHtml(p.description || "") + '</p>' +
        '<div class="detail-price">' + fmtPrice(p.price) + " so'm</div>" +
        '<button class="page-cta" id="detail-add-btn">' + (qty > 0 ? ("✅ Savatda: " + qty + " ta — yana qo'shish") : "➕ Savatga qo'shish") + '</button>' +
      '</div>';
    setupGalleryScroll(el);
    document.getElementById("detail-add-btn").onclick = function () { changeQty(p.id, 1); render(); };
  };

  // ---------- Savat ----------
  // MUHIM (29-avgust, foydalanuvchi so'rovi bilan O'ZGARDI): ILGARI bu
  // yerda buyurtma yaratilmasdan, mijoz chatga qaytarilardi (to'lov faqat
  // chatda bo'lardi) - Mini App'ning webview'i ishonchsiz chiqib qolgani
  // uchun shunday qilingan edi. ENDI foydalanuvchi ANIQ so'radi: to'lov
  // (hamyondan) TO'LIQ Mini App ICHIDA bo'lsin. "✅ Buyurtmani yakunlash"
  // tugmasi tepasida (shaxsiy ma'lumotlar tepasida emas, PASTIDA - so'rov
  // shunday: "...ni tepasida shaxsiy ma'lumotlari... bo'lsin") ism/telefon/
  // manzil ko'rsatiladi - profildan oldindan to'ldirilgan, lekin TAHRIRLASH
  // mumkin (boshqa odamga sovg'a qilib yuborish uchun). Tugma bosilganda
  // /api/request_checkout ENDI chaqirilmaydi (backend'da qoldirilgan,
  // lekin frontend uni ishlatmaydi) - buning o'rniga yangi "checkout"
  // ko'rinishiga o'tiladi.
  VIEW_RENDERERS.cart = function (el) {
    var pids = Object.keys(state.cart).filter(function (pid) { return state.cart[pid] > 0; });
    if (!pids.length) {
      el.innerHTML = '<div class="cart-empty">🛒 Savatingiz bo\'sh</div>';
      return;
    }
    var rows = pids.map(function (pid) {
      var p = state.products.filter(function (x) { return x.id === Number(pid); })[0];
      if (!p) return "";
      var qty = state.cart[pid];
      var img = (p.photos && p.photos[0]) ? '<img src="' + photoUrl(p.photos[0]) + '">' : '<div class="noimg small">🎁</div>';
      return (
        '<div class="cart-row" data-pid="' + p.id + '">' +
          '<div class="cart-row-img">' + img + '</div>' +
          '<div class="cart-row-info">' +
            '<div class="cart-row-name">' + escapeHtml(p.name) + '</div>' +
            '<div class="cart-row-price">' + fmtPrice(p.price) + " so'm</div>" +
          '</div>' +
          '<div class="stepper"><button class="dec">−</button><span>' + qty + '</span><button class="inc">+</button></div>' +
        '</div>'
      );
    }).join("");
    var p = state.profile || {};
    el.innerHTML =
      '<div class="cart-list">' + rows + '</div>' +
      '<div class="cart-total">Jami: ' + fmtPrice(cartSubtotal()) + " so'm</div>" +
      '<div class="screen" style="padding-top:4px">' +
        '<div class="form-group"><label class="form-label">Ism-familiya</label><input class="form-input" id="ck-name" value="' + escapeHtml(p.full_name || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="ck-phone" value="' + escapeHtml(p.phone || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Manzil</label><input class="form-input" id="ck-address" value="' + escapeHtml(p.address || "") + '"></div>' +
        '<div class="form-hint">Boshqa odamga sovg\'a qilib yubormoqchi bo\'lsangiz, shu ma\'lumotlarni tahrirlashingiz mumkin.</div>' +
        '<div class="form-error hidden" id="ck-error"></div>' +
        '<button class="page-cta" id="cart-finish-btn">✅ Buyurtmani yakunlash</button>' +
      '</div>';
    el.querySelectorAll(".cart-row").forEach(function (row) {
      var pid = Number(row.getAttribute("data-pid"));
      row.querySelector(".dec").onclick = function () { changeQty(pid, -1); };
      row.querySelector(".inc").onclick = function () { changeQty(pid, 1); };
    });
    document.getElementById("cart-finish-btn").onclick = goToCheckout;

    // Profil hali yuklanmagan bo'lsa - fonda yuklab, maydonlarni to'ldiramiz
    // (agar mijoz shu orada allaqachon biror narsa yozgan bo'lsa, uni
    // bosib yubormaymiz).
    if (!state.profile) {
      api("/api/profile").then(function (r) {
        if (!r.ok || currentView() !== "cart") return;
        state.profile = r.data;
        var nameEl = document.getElementById("ck-name");
        var phoneEl = document.getElementById("ck-phone");
        var addrEl = document.getElementById("ck-address");
        if (nameEl && !nameEl.value) nameEl.value = r.data.full_name || "";
        if (phoneEl && !phoneEl.value) phoneEl.value = r.data.phone || "";
        if (addrEl && !addrEl.value) addrEl.value = r.data.address || "";
      });
    }
  };

  function goToCheckout() {
    var full_name = document.getElementById("ck-name").value.trim();
    var phone = document.getElementById("ck-phone").value.trim();
    var address = document.getElementById("ck-address").value.trim();
    var errEl = document.getElementById("ck-error");
    if (full_name.length < 2 || phone.length < 7 || address.length < 3) {
      errEl.textContent = "Iltimos, ism, telefon va manzilni to'g'ri to'ldiring.";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    state.checkoutForm = { full_name: full_name, phone: phone, address: address };
    pushView("checkout");
  }

  // ---------- To'lov (checkout) - 29-avgust: YANGI, Mini App ichida ----------
  // MUHIM: chegirma FAQAT foiz (discount_percent) sifatida saqlanadi va
  // har safar joriy savat summasidan qayta hisoblanadi (serverdagi kabi
  // butun songa yaxlitlab) - shu bilan mijoz promo qo'llagandan keyin
  // savatni o'zgartirsa ham, ko'rsatilgan chegirma summasi noto'g'ri
  // chiqib qolmaydi. Yakuniy summa va balans HAR DOIM server tomonda
  // (/api/checkout) qayta tekshiriladi - bu yerdagi hisob faqat ko'rsatish
  // uchun.
  var submittingCheckout = false;
  VIEW_RENDERERS.checkout = function (el) {
    var pids = Object.keys(state.cart).filter(function (pid) { return state.cart[pid] > 0; });
    if (!pids.length) {
      el.innerHTML = '<div class="screen"><div class="empty">Savatingiz bo\'sh.</div></div>';
      return;
    }
    var itemsHtml = pids.map(function (pid) {
      var p = state.products.filter(function (x) { return x.id === Number(pid); })[0];
      if (!p) return "";
      return '<div class="card-line">' + state.cart[pid] + ' x ' + escapeHtml(p.name) + ' — ' + fmtPrice(p.price * state.cart[pid]) + " so'm</div>";
    }).join("");
    var subtotal = cartSubtotal();
    var promo = state.promo;
    var discount = promo ? Math.floor(subtotal * promo.discount_percent / 100) : 0;
    var total = Math.max(subtotal - discount, 0);
    var balance = (state.profile && state.profile.balance) || 0;
    var enough = balance >= total;

    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">💳 To\'lov</div>' +
        '<div class="info-card"><div class="card-line"><b>Buyurtmangiz:</b></div>' + itemsHtml + '</div>' +
        '<div class="form-group"><label class="form-label">Promo-kod (bo\'lsa)</label>' +
          '<div style="display:flex;gap:8px;align-items:flex-start">' +
            '<input class="form-input" id="ck-promo" placeholder="Masalan: FIGO10" value="' + escapeHtml(promo ? promo.code : "") + '" style="flex:1">' +
            '<button class="page-cta" id="ck-promo-apply" style="width:auto;margin:0;padding:0 18px;height:47px">✅</button>' +
          '</div>' +
          '<div class="form-hint" id="ck-promo-msg" style="margin-bottom:0"></div>' +
        '</div>' +
        '<div class="info-card">' +
          '<div class="card-line">Mahsulotlar: ' + fmtPrice(subtotal) + " so'm</div>" +
          (discount ? '<div class="card-line">Chegirma (−' + promo.discount_percent + '%): −' + fmtPrice(discount) + " so'm</div>" : "") +
          '<div class="card-line"><b>Jami: ' + fmtPrice(total) + " so'm</b></div>" +
          '<div class="card-line">💰 Hamyoningizda: ' + fmtPrice(balance) + " so'm</div>" +
        '</div>' +
        (enough
          ? '<button class="page-cta" id="ck-pay-btn">✅ Hamyondan to\'lash (' + fmtPrice(total) + " so'm)</button>"
          : (
              '<div class="form-error" style="margin-bottom:10px">Hamyoningizda ' + fmtPrice(total - balance) + " so'm yetishmayapti." + '</div>' +
              '<button class="page-cta" id="ck-topup-btn">💰 Hamyonni to\'ldirish</button>'
            )
        ) +
      '</div>';

    document.getElementById("ck-promo-apply").onclick = applyPromo;
    var payBtn = document.getElementById("ck-pay-btn");
    if (payBtn) payBtn.onclick = submitCheckout;
    var topupBtn = document.getElementById("ck-topup-btn");
    if (topupBtn) topupBtn.onclick = function () {
      state.topupPrefill = Math.max(total - balance, 0);
      pushView("topup");
    };
  };

  function applyPromo() {
    var codeInput = document.getElementById("ck-promo");
    var code = codeInput.value.trim();
    var msgEl = document.getElementById("ck-promo-msg");
    if (!code) {
      state.promo = null;
      render();
      return;
    }
    var btn = document.getElementById("ck-promo-apply");
    btn.disabled = true;
    api("/api/promo/check", { method: "POST", body: JSON.stringify({ code: code }) }).then(function (r) {
      if (r.ok && r.data.valid) {
        state.promo = { code: r.data.code, discount_percent: r.data.discount_percent };
        render();
        showToast("✅ Promo-kod qo'llandi: -" + r.data.discount_percent + "%");
      } else {
        state.promo = null;
        btn.disabled = false;
        if (msgEl) msgEl.textContent = "Promo-kod topilmadi yoki yaroqsiz.";
      }
    });
  }

  function submitCheckout() {
    if (submittingCheckout) return;
    submittingCheckout = true;
    var btn = document.getElementById("ck-pay-btn");
    if (btn) { btn.disabled = true; btn.textContent = "⏳ Yuborilmoqda..."; }
    var form = state.checkoutForm || {};
    api("/api/checkout", {
      method: "POST",
      body: JSON.stringify({
        full_name: form.full_name, phone: form.phone, address: form.address,
        payment_method: "balance",
        promo_code: state.promo ? state.promo.code : null,
      }),
    }).then(function (r) {
      submittingCheckout = false;
      if (r.ok) {
        state.checkoutForm = null;
        state.promo = null;
        navStack = [];
        render();
        showToast("✅ Buyurtmangiz qabul qilindi!");
        loadCart().then(function () { renderGrid(); updateMainButton(); });
        api("/api/profile").then(function (pr) { if (pr.ok) state.profile = pr.data; });
      } else {
        if (btn) { btn.disabled = false; btn.textContent = "✅ Hamyondan to'lash"; }
        if (r.data && r.data.error === "insufficient_balance") {
          showToast("Hamyoningizda yetarli mablag' yo'q.");
          api("/api/profile").then(function (pr) { if (pr.ok) state.profile = pr.data; render(); });
        } else if (r.data && r.data.error === "empty_cart") {
          showToast("Savatingiz bo'sh.");
          popView();
        } else {
          showToast("Buyurtma berib bo'lmadi. Qaytadan urinib ko'ring.");
        }
      }
    });
  }

  // ---------- Hamyonni to'ldirish (topup) - 29-avgust: YANGI ----------
  // 2 ta usul: 1) Click orqali avtomatik - hali Click kompaniyasidan API
  // olinmagani uchun HOZIRCHA faqat ko'rinadi, bosilmaydi ("Tez kunda").
  // 2) Bank kartasiga o'tkazib, chekning skrinshotini yuborish - skrinshot
  // MAJBURIY (foydalanuvchi so'rovi bilan qat'iy talab qilinadi, xuddi
  // chatdagi eski oqim ham endi shunday - handlers/profile.py'ga qarang).
  // So'rov yuborilgach BALANS DARHOL o'zgarmaydi - operator admin panelda
  // tasdiqlagach qo'shiladi (eski chat oqimi bilan bir xil mantiq).
  var topupScreenshot = null;
  VIEW_RENDERERS.topup = function (el) {
    topupScreenshot = null;
    var prefill = state.topupPrefill;
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">💰 Hamyonni to\'ldirish</div>' +
        '<div class="form-group"><label class="form-label">Summasi (so\'m)</label>' +
          '<input class="form-input" id="tu-amount" type="number" inputmode="numeric" placeholder="Masalan: 100000" value="' + (prefill ? String(prefill) : "") + '"></div>' +

        '<div class="info-card" style="opacity:0.6">' +
          '<div class="card-line"><b>⚡ Click orqali</b> — Tez kunda</div>' +
          '<div class="card-line">Hozircha ishlamaydi. Pastdagi bank kartasi usulidan foydalaning.</div>' +
        '</div>' +

        '<div class="form-group"><label class="form-label">💳 Bank kartasi rekvizitlari</label>' +
          '<div class="info-card"><div class="card-line">' +
            (state.paymentInfo ? escapeHtml(state.paymentInfo).replace(/\n/g, "<br>") : "Rekvizitlar hozircha mavjud emas, operatorga yozing.") +
          '</div></div>' +
        '</div>' +

        '<div class="form-group"><label class="form-label">To\'lov chekining skrinshoti (MAJBURIY)</label>' +
          '<div class="photo-row" id="tu-photo-row"><button class="photo-pick-btn" id="tu-photo-pick">+</button></div>' +
          '<input type="file" id="tu-photo-input" accept="image/*" style="display:none"></div>' +

        '<div class="form-error hidden" id="tu-error"></div>' +
        '<button class="page-cta" id="tu-submit">✅ So\'rov yuborish</button>' +
      '</div>';

    document.getElementById("tu-photo-pick").onclick = function () { document.getElementById("tu-photo-input").click(); };
    document.getElementById("tu-photo-input").onchange = function (e) {
      var file = (e.target.files || [])[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        topupScreenshot = reader.result;
        document.getElementById("tu-photo-row").innerHTML = '<img class="photo-thumb" src="' + topupScreenshot + '">';
      };
      reader.readAsDataURL(file);
    };
    document.getElementById("tu-submit").onclick = submitTopup;
  };

  function submitTopup() {
    var amountStr = (document.getElementById("tu-amount").value || "").replace(/\s/g, "");
    var errEl = document.getElementById("tu-error");
    var amount = parseInt(amountStr, 10);
    var problems = [];
    if (!amountStr || isNaN(amount) || amount <= 0) problems.push("summani to'g'ri kiriting");
    if (!topupScreenshot) problems.push("chekning skrinshotini yuklang (MAJBURIY)");
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var btn = document.getElementById("tu-submit");
    btn.disabled = true; btn.textContent = "⏳ Yuborilmoqda...";
    api("/api/topup", {
      method: "POST",
      body: JSON.stringify({ amount: amount, screenshot: topupScreenshot }),
    }).then(function (r) {
      if (r.ok) {
        state.topupPrefill = null;
        showToast("✅ So'rovingiz yuborildi — operator tasdiqlagach hamyoningizga qo'shiladi");
        popView();
      } else {
        btn.disabled = false; btn.textContent = "✅ So'rov yuborish";
        if (r.data && r.data.error === "screenshot_required") {
          errEl.textContent = "Iltimos, chekning skrinshotini yuklang (MAJBURIY).";
          errEl.classList.remove("hidden");
        } else {
          showToast("Yuborib bo'lmadi. Qaytadan urinib ko'ring.");
        }
      }
    });
  }

  // ---------- Vazifalar (🎯 tanga/mukofot tizimi, 29-avgust) ----------
  // Instagram/YouTube kabi tarmoqlarda like/obuna/komentariya kabi
  // vazifalar - mijoz bajarib skrinshot yuboradi, operator tasdiqlasa
  // mukofot to'g'ridan-to'g'ri hamyonga (so'm sifatida) qo'shiladi.
  // Skrinshot 100% avtomatik tekshirilmaydi (Instagram/YouTube bu
  // ma'lumotni tashqi dasturga bermaydi) - HAR DOIM operator ko'rib chiqadi.
  var TASK_PLATFORM_ICON = { instagram: "📸", youtube: "▶️", boshqa: "🔗" };
  var TASK_TYPE_LABEL = {
    like: "👍 Layk bosish", subscribe: "🔔 Obuna bo'lish",
    comment: "💬 Komentariya yozish", repost: "🔁 Ulashish/Repost", boshqa: "✅ Bajarish",
  };
  var taskList = [];
  var selectedTask = null;
  var taskScreenshot = null;

  VIEW_RENDERERS.tasks = function (el) {
    el.innerHTML = '<div class="screen"><div class="screen-title">🎯 Vazifalar</div><div class="empty">Yuklanmoqda...</div></div>';
    api("/api/tasks").then(function (r) {
      if (currentView() !== "tasks") return;
      if (!r.ok) { el.innerHTML = '<div class="screen"><div class="empty">Yuklab bo\'lmadi.</div></div>'; return; }
      taskList = (r.data && r.data.tasks) || [];
      if (!taskList.length) {
        el.innerHTML = '<div class="screen"><div class="screen-title">🎯 Vazifalar</div><div class="empty">Hozircha vazifa yo\'q.</div></div>';
        return;
      }
      var cards = taskList.map(function (t) {
        var icon = TASK_PLATFORM_ICON[t.platform] || "🔗";
        var actionHtml;
        if (t.my_status === "tasdiqlandi") actionHtml = '<span class="task-badge ok">✅ Tasdiqlandi</span>';
        else if (t.my_status === "kutilmoqda") actionHtml = '<span class="task-badge wait">⏳ Ko\'rib chiqilmoqda</span>';
        else {
          var label = (t.my_status === "rad etildi") ? "🔁 Qaytadan urinish" : "Bajarish";
          actionHtml = '<button class="task-btn" data-tid="' + t.id + '">' + label + '</button>';
        }
        return (
          '<div class="task-card">' +
            '<div class="task-title">' + icon + ' ' + escapeHtml(t.title) + '</div>' +
            '<div class="task-line">' + (TASK_TYPE_LABEL[t.task_type] || t.task_type) + ' — 🎁 ' + fmtPrice(t.reward_amount) + " so'm</div>" +
            (t.my_status === "rad etildi" ? '<div class="task-line" style="color:#c1272d">❌ Avvalgi urinish rad etildi</div>' : "") +
            actionHtml +
          '</div>'
        );
      }).join("");
      el.innerHTML =
        '<div class="screen">' +
          '<div class="screen-title">🎯 Vazifalar</div>' +
          '<div class="form-hint">Vazifani bajaring, skrinshot yuboring — operator tekshirib tasdiqlasa, mukofot hamyoningizga qo\'shiladi.</div>' +
        '</div>' + cards;
      el.querySelectorAll("[data-tid]").forEach(function (btn) {
        btn.onclick = function () {
          var t = taskList.filter(function (x) { return x.id === Number(btn.getAttribute("data-tid")); })[0];
          if (t) openTaskDetail(t);
        };
      });
    });
  };

  function openTaskDetail(t) {
    selectedTask = t;
    pushView("taskDetail");
  }

  VIEW_RENDERERS.taskDetail = function (el) {
    taskScreenshot = null;
    var t = selectedTask;
    if (!t) { el.innerHTML = '<div class="screen"><div class="empty">Vazifa topilmadi.</div></div>'; return; }
    var icon = TASK_PLATFORM_ICON[t.platform] || "🔗";
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">' + icon + ' ' + escapeHtml(t.title) + '</div>' +
        '<div class="info-card">' +
          '<div class="card-line"><b>Vazifa turi:</b> ' + (TASK_TYPE_LABEL[t.task_type] || t.task_type) + '</div>' +
          '<div class="card-line"><b>Mukofot:</b> 🎁 ' + fmtPrice(t.reward_amount) + " so'm</div>" +
          (t.description ? '<div class="card-line" style="margin-top:6px">' + escapeHtml(t.description).replace(/\n/g, "<br>") + '</div>' : "") +
        '</div>' +
        '<a class="page-cta" style="display:block;text-align:center;text-decoration:none;margin-bottom:16px" href="' + escapeHtml(t.target_url) + '" target="_blank" rel="noopener">🔗 Havolani ochish</a>' +
        '<div class="form-group"><label class="form-label">Bajarganingizni tasdiqlovchi skrinshot (MAJBURIY)</label>' +
          '<div class="photo-row" id="tk-photo-row"><button class="photo-pick-btn" id="tk-photo-pick">+</button></div>' +
          '<input type="file" id="tk-photo-input" accept="image/*" style="display:none"></div>' +
        '<div class="form-error hidden" id="tk-error"></div>' +
        '<button class="page-cta" id="tk-submit">✅ Skrinshotni yuborish</button>' +
      '</div>';

    document.getElementById("tk-photo-pick").onclick = function () { document.getElementById("tk-photo-input").click(); };
    document.getElementById("tk-photo-input").onchange = function (e) {
      var file = (e.target.files || [])[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        taskScreenshot = reader.result;
        document.getElementById("tk-photo-row").innerHTML = '<img class="photo-thumb" src="' + taskScreenshot + '">';
      };
      reader.readAsDataURL(file);
    };
    document.getElementById("tk-submit").onclick = submitTaskProof;
  };

  function submitTaskProof() {
    var t = selectedTask;
    var errEl = document.getElementById("tk-error");
    if (!taskScreenshot) {
      errEl.textContent = "Iltimos, skrinshot yuklang (MAJBURIY).";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var btn = document.getElementById("tk-submit");
    btn.disabled = true; btn.textContent = "⏳ Yuborilmoqda...";
    api("/api/task_submit", {
      method: "POST",
      body: JSON.stringify({ task_id: t.id, screenshot: taskScreenshot }),
    }).then(function (r) {
      if (r.ok) {
        showToast("✅ Yuborildi — operator tekshirib chiqqach mukofot hamyoningizga qo'shiladi");
        popView();
      } else {
        btn.disabled = false; btn.textContent = "✅ Skrinshotni yuborish";
        if (r.data && r.data.error === "already_submitted") {
          showToast("Bu vazifa uchun so'rovingiz allaqachon ko'rib chiqilmoqda.");
          popView();
        } else {
          showToast("Yuborib bo'lmadi. Qaytadan urinib ko'ring.");
        }
      }
    });
  }

  // ---------- Profil ----------
  // MUHIM: bu yerdagi backend endpoint (/api/profile GET+POST) allaqachon
  // avvaldan mavjud edi (webapp_api.py) - faqat frontend tomoni ochilmagan
  // edi. Buyurtma berish/to'lov kabi murakkab, avval muammo chiqargan
  // oqimlarga TEGILMAGAN - faqat ism/telefon/manzilni ko'rish/tahrirlash,
  // bu ancha sodda va xavfsiz.
  VIEW_RENDERERS.profile = function (el) {
    el.innerHTML = '<div class="screen"><div class="screen-title">👤 Profil</div><div class="empty">Yuklanmoqda...</div></div>';
    api("/api/profile").then(function (r) {
      if (currentView() !== "profile") return;
      if (!r.ok) { el.innerHTML = '<div class="screen"><div class="empty">Yuklab bo\'lmadi.</div></div>'; return; }
      state.profile = r.data;
      renderProfileForm(el);
    });
  };

  function renderProfileForm(el) {
    var p = state.profile || {};
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">👤 Profil</div>' +
        '<div class="info-card"><div class="card-line">💰 Hamyon balansi: <b>' + fmtPrice(p.balance || 0) + " so'm</b></div></div>" +
        '<button class="page-cta" id="pf-topup" style="margin-top:0;margin-bottom:18px">💰 Hamyonni to\'ldirish</button>' +
        '<div class="form-group"><label class="form-label">Ism-familiya</label><input class="form-input" id="pf-name" value="' + escapeHtml(p.full_name || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="pf-phone" value="' + escapeHtml(p.phone || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Manzil</label><input class="form-input" id="pf-address" value="' + escapeHtml(p.address || "") + '"></div>' +
        '<div class="form-error hidden" id="pf-error"></div>' +
        '<button class="page-cta" id="pf-save">✅ Saqlash</button>' +
      '</div>';
    document.getElementById("pf-topup").onclick = function () {
      state.topupPrefill = null;
      pushView("topup");
    };
    document.getElementById("pf-save").onclick = function () {
      var full_name = document.getElementById("pf-name").value.trim();
      var phone = document.getElementById("pf-phone").value.trim();
      var address = document.getElementById("pf-address").value.trim();
      var errEl = document.getElementById("pf-error");
      if (full_name.length < 2 || phone.length < 7 || address.length < 3) {
        errEl.textContent = "Iltimos, barcha maydonlarni to'g'ri to'ldiring.";
        errEl.classList.remove("hidden");
        return;
      }
      errEl.classList.add("hidden");
      var btn = document.getElementById("pf-save");
      btn.disabled = true; btn.textContent = "⏳ Saqlanmoqda...";
      api("/api/profile", {
        method: "POST",
        body: JSON.stringify({ full_name: full_name, phone: phone, address: address }),
      }).then(function (r) {
        btn.disabled = false; btn.textContent = "✅ Saqlash";
        if (r.ok) {
          state.profile = Object.assign({}, state.profile, { full_name: full_name, phone: phone, address: address });
          showToast("Saqlandi ✅");
        } else {
          showToast("Saqlab bo'lmadi. Qaytadan urinib ko'ring.");
        }
      });
    };
  }

  // ---------- Buyurtmalarim (o'qish uchun - status ko'rish) ----------
  var CUSTOMER_STATUS_LABELS = {
    "yangi": "🕓 Kutilmoqda",
    "to'landi (hamyondan)": "🕓 Kutilmoqda (to'lov qabul qilindi)",
    "to'lov kutilmoqda (karta)": "💳 To'lov kutilmoqda",
    "to'landi (karta)": "🕓 Kutilmoqda (to'lov qabul qilindi)",
    "qabul qilindi": "✅ Qabul qilindi, yig'ilmoqda",
    "chiqarildi": "🚚 Chiqarib yuborildi",
    "arxiv": "📦 Yetkazildi",
    "muammo": "⚠️ Muammo bor — operator siz bilan bog'lanadi",
  };

  VIEW_RENDERERS.orders = function (el) {
    el.innerHTML = '<div class="screen"><div class="screen-title">📦 Buyurtmalarim</div><div class="empty">Yuklanmoqda...</div></div>';
    api("/api/orders").then(function (r) {
      if (currentView() !== "orders") return;
      if (!r.ok) { el.innerHTML = '<div class="screen"><div class="empty">Yuklab bo\'lmadi.</div></div>'; return; }
      var orders = r.data.orders || [];
      var body;
      if (!orders.length) {
        body = '<div class="empty">Sizda hali buyurtmalar yo\'q.</div>';
      } else {
        body = orders.map(function (o) {
          var statusLabel = CUSTOMER_STATUS_LABELS[o.status] || o.status;
          var reasonLine = (o.status === "muammo" && o.problem_reason)
            ? '<div class="card-line">📝 ' + escapeHtml(o.problem_reason) + '</div>' : "";
          return (
            '<div class="info-card">' +
              '<div class="card-line"><b>#' + o.id + ' — ' + fmtPrice(o.total_price) + " so'm</b></div>" +
              '<div class="card-line">' + statusLabel + '</div>' +
              reasonLine +
            '</div>'
          );
        }).join("");
      }
      el.innerHTML = '<div class="screen"><div class="screen-title">📦 Buyurtmalarim</div>' + body + '</div>';
    });
  };

  // ---------- Yangiliklar/e'lonlar ----------
  VIEW_RENDERERS.announcements = function (el) {
    el.innerHTML = '<div class="screen"><div class="screen-title">📰 Yangiliklar</div><div class="empty">Yuklanmoqda...</div></div>';
    api("/api/announcements").then(function (r) {
      if (currentView() !== "announcements") return;
      if (!r.ok) { el.innerHTML = '<div class="screen"><div class="empty">Yuklab bo\'lmadi.</div></div>'; return; }
      var items = r.data.announcements || [];
      var body = items.length
        ? items.map(function (a) {
            var img = a.photo_file_id ? '<img src="' + photoUrl(a.photo_file_id) + '">' : "";
            return '<div class="news-card">' + img + '<div class="news-text">' + escapeHtml(a.text) + '</div></div>';
          }).join("")
        : '<div class="empty">Hozircha yangilik yo\'q.</div>';
      el.innerHTML = '<div class="screen"><div class="screen-title">📰 Yangiliklar</div>' + body + '</div>';
    });
  };

  // ---------- Operatorga yozish (29-avgust: YANGI, "Chat" o'rniga) ----------
  VIEW_RENDERERS.contact = function (el) {
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">💬 Operatorga yozish</div>' +
        (state.contactInfo
          ? '<div class="info-card"><div class="card-line">' + escapeHtml(state.contactInfo).replace(/\n/g, "<br>") + '</div></div>'
          : "") +
        '<div class="form-group"><label class="form-label">Xabaringiz</label>' +
          '<textarea class="form-textarea" id="cm-text" placeholder="Savolingiz yoki murojaatingizni shu yerga yozing..." style="min-height:120px"></textarea></div>' +
        '<div class="form-error hidden" id="cm-error"></div>' +
        '<button class="page-cta" id="cm-submit">✅ Yuborish</button>' +
      '</div>';
    document.getElementById("cm-submit").onclick = submitContactMessage;
  };

  function submitContactMessage() {
    var text = document.getElementById("cm-text").value.trim();
    var errEl = document.getElementById("cm-error");
    if (text.length < 3) {
      errEl.textContent = "Iltimos, xabaringizni yozing.";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var btn = document.getElementById("cm-submit");
    btn.disabled = true; btn.textContent = "⏳ Yuborilmoqda...";
    api("/api/contact_message", { method: "POST", body: JSON.stringify({ message: text }) }).then(function (r) {
      if (r.ok) {
        showToast("✅ Murojaatingiz operatorga yuborildi");
        popView();
      } else {
        btn.disabled = false; btn.textContent = "✅ Yuborish";
        showToast("Yuborib bo'lmadi. Qaytadan urinib ko'ring.");
      }
    });
  }

  // ---------- Shaxsiy buyurtma (o'z rasmidan) ----------
  // MUHIM: bu yerdagi /api/custom_order endpoint ham avvaldan mavjud edi
  // (webapp_api.py) - u to'g'ridan-to'g'ri so'rovni YARATADI (checkout'dan
  // farqli o'laroq bu yerda to'lov/balans kabi xavfli hisob-kitob yo'q,
  // shuning uchun Mini App orqali to'g'ridan-to'g'ri yuborish xavfsiz).
  var customPhoto = null;

  VIEW_RENDERERS.custom = function (el) {
    customPhoto = null;
    var p = state.profile || {};
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">🎨 Shaxsiy buyurtma</div>' +
        '<div class="form-group"><label class="form-label">Rasm (odam, uy hayvoni, logotip va h.k.)</label>' +
          '<div class="photo-row" id="co-photo-row"><button class="photo-pick-btn" id="co-photo-pick">+</button></div>' +
          '<input type="file" id="co-photo-input" accept="image/*" style="display:none"></div>' +
        '<div class="form-group"><label class="form-label">Nima tayyorlab berishimizni xohlaysiz?</label>' +
          '<textarea class="form-textarea" id="co-desc" placeholder="Masalan: shu rasmdagi itdan kichik haykalcha"></textarea></div>' +
        '<div class="form-group"><label class="form-label">Ism-familiya</label><input class="form-input" id="co-name" value="' + escapeHtml(p.full_name || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="co-phone" value="' + escapeHtml(p.phone || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Manzil</label><input class="form-input" id="co-address" value="' + escapeHtml(p.address || "") + '"></div>' +
        '<div class="form-error hidden" id="co-error"></div>' +
        '<button class="page-cta" id="co-submit">✅ Yuborish</button>' +
      '</div>';

    document.getElementById("co-photo-pick").onclick = function () { document.getElementById("co-photo-input").click(); };
    document.getElementById("co-photo-input").onchange = function (e) {
      var file = (e.target.files || [])[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        customPhoto = reader.result;
        document.getElementById("co-photo-row").innerHTML = '<img class="photo-thumb" src="' + customPhoto + '">';
      };
      reader.readAsDataURL(file);
    };
    document.getElementById("co-submit").onclick = submitCustomOrder;
  };

  function submitCustomOrder() {
    var description = document.getElementById("co-desc").value.trim();
    var full_name = document.getElementById("co-name").value.trim();
    var phone = document.getElementById("co-phone").value.trim();
    var address = document.getElementById("co-address").value.trim();
    var errEl = document.getElementById("co-error");
    var problems = [];
    if (!customPhoto) problems.push("rasm tanlang");
    if (description.length < 3) problems.push("tavsifni yozing");
    if (full_name.length < 2) problems.push("ismingizni yozing");
    if (phone.length < 7) problems.push("telefon raqamingizni yozing");
    if (address.length < 3) problems.push("manzilingizni yozing");
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var btn = document.getElementById("co-submit");
    btn.disabled = true; btn.textContent = "⏳ Yuborilmoqda...";
    api("/api/custom_order", {
      method: "POST",
      body: JSON.stringify({
        description: description, full_name: full_name, phone: phone, address: address, photo: customPhoto,
      }),
    }).then(function (r) {
      if (r.ok) {
        showToast("✅ So'rovingiz qabul qilindi — tez orada bog'lanamiz");
        popView();
      } else {
        btn.disabled = false; btn.textContent = "✅ Yuborish";
        showToast("Yuborib bo'lmadi. Qaytadan urinib ko'ring.");
      }
    });
  }

  // ---------- Boshlash ----------
  loadCatalog()
    .then(function () {
      activeCategory = state.categories[0] ? state.categories[0].name : null;
      renderTabs(); renderSubtabs(); renderGrid();
      return loadCart();
    })
    .then(function () { renderGrid(); updateMainButton(); return loadConfig(); })
    .catch(function () {
      document.getElementById("grid").innerHTML = '<div class="empty">Yuklashda xatolik yuz berdi. Iltimos, qayta urinib ko\'ring.</div>';
    });
})();
</script>
</body>
</html>
