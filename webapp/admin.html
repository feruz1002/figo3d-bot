<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Figo3D Boshqaruv paneli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff; --text: #111111; --hint: #8e8e93; --link: #2ea6ff;
    --button: #2ea6ff; --button-text: #ffffff; --secondary-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  #app { min-height: 100vh; padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 58px 4px 14px; }
  header h1 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
  #current-tab-label { color: var(--hint); font-size: 13px; font-weight: 500; }
  .tab { flex: none; border: none; border-radius: 999px; padding: 8px 14px; background: var(--secondary-bg);
    color: var(--text); font-size: 13.5px; font-weight: 500; }
  .tab.active { background: var(--button); color: var(--button-text); }

  /* ---------- 29-avgust: yuqoridagi tab'lar o'rniga o'ng tomondan
     chiqadigan (slide-out) menyu - "ko'rinadigan/ko'rinmaydigan qilish"
     imkoniyati ☰ tugmasi orqali. Mijozlar Mini App'idagi chap menyuga
     o'xshash, faqat OYNA O'NG TOMONDAN chiqadi. ---------- */
  #menu-toggle {
    position: fixed; top: 14px; right: 12px; z-index: 26; width: 38px; height: 38px;
    border: none; border-radius: 10px; background: var(--secondary-bg); color: var(--text);
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #sidebar-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 24;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  #sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; right: 0; width: 78%; max-width: 300px; z-index: 25;
    background: var(--bg); box-shadow: -2px 0 18px rgba(0,0,0,0.2);
    transform: translateX(100%); transition: transform 0.22s ease;
    overflow-y: auto; padding: 16px 0 20px;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar .sidebar-title { font-size: 17px; font-weight: 700; padding: 4px 18px 14px; }
  .sidebar-item {
    display: flex; align-items: center; width: 100%; border: none; background: transparent;
    color: var(--text); font-size: 15px; font-weight: 500; padding: 13px 18px; text-align: left;
  }
  .sidebar-item.active { background: var(--secondary-bg); font-weight: 700; }
  .sidebar-item:active { background: var(--secondary-bg); }
  .sidebar-item .badge {
    margin-left: auto; background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 999px; padding: 2px 7px; min-width: 18px; text-align: center;
  }
  #content { padding: 4px 14px 20px; }
  .empty { text-align: center; color: var(--hint); padding: 50px 20px; font-size: 15px; }
  .card { background: var(--secondary-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .card-title { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .card-line { font-size: 13px; color: var(--hint); line-height: 1.5; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .card-btn { flex: 1; border: none; border-radius: 10px; padding: 9px 0; font-size: 13px; font-weight: 600;
    background: var(--button); color: var(--button-text); }
  .card-btn.danger { background: #ff3b30; }
  .card-btn:disabled { opacity: 0.5; }
  .fab { position: fixed; right: 18px; bottom: 22px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--button); color: var(--button-text); font-size: 26px; border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 10; }

  #overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; }
  #overlay.hidden { display: none; }
  .screen { padding: 14px 16px 30px; }
  .screen-title { font-size: 19px; font-weight: 700; margin: 4px 0 16px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12.5px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
  .form-input, .form-select, .form-textarea { width: 100%; border: none; border-radius: 12px;
    background: var(--secondary-bg); color: var(--text); padding: 13px 14px; font-size: 15px; font-family: inherit; }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-error { color: #ff3b30; font-size: 12.5px; margin-top: 6px; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .photo-pick-btn { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--hint);
    background: transparent; color: var(--hint); font-size: 22px; }

  #toast { position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 50; background: #1c1c1e;
    color: #fff; padding: 13px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.4;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25); transform: translateY(140%); transition: transform 0.25s ease; }
  #toast.show { transform: translateY(0); }
  .lockscreen { display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 60px 24px; min-height: 70vh; }
  .lockscreen .icon { font-size: 48px; margin-bottom: 14px; }
</style>
</head>
<body>
<button id="menu-toggle">☰</button>
<div id="sidebar-backdrop"></div>
<nav id="sidebar">
  <div class="sidebar-title">🛠 Bo'limlar</div>
  <div id="sidebar-items"></div>
</nav>
<div id="app">
  <header>
    <h1>🛠 Boshqaruv paneli</h1>
    <div id="current-tab-label"></div>
  </header>
  <main id="content"></main>
</div>
<button class="fab" id="fab" style="display:none">➕</button>
<div id="overlay" class="hidden"></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  function themeVar(name, fallback) { return (tg && tg.themeParams && tg.themeParams[name]) ? tg.themeParams[name] : fallback; }
  function applyTheme() {
    var root = document.documentElement.style;
    root.setProperty("--bg", themeVar("bg_color", "#ffffff"));
    root.setProperty("--text", themeVar("text_color", "#111111"));
    root.setProperty("--hint", themeVar("hint_color", "#8e8e93"));
    root.setProperty("--button", themeVar("button_color", "#2ea6ff"));
    root.setProperty("--button-text", themeVar("button_text_color", "#ffffff"));
    root.setProperty("--secondary-bg", themeVar("secondary_bg_color", "#f4f4f5"));
  }
  applyTheme();
  if (tg) tg.onEvent("themeChanged", applyTheme);

  function fmtPrice(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function initDataStr() { return tg ? tg.initData : ""; }

  var toastTimer = null;
  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text; el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 5000);
  }

  // MUHIM (29-avgust, "Telegram qotib qolyapti" muammosiga javoban): Mini App
  // uzoq vaqt fonda qolib ketsa, o'sha payt tugamagan so'rov(lar) Telegram'ning
  // ichki WebView komponentini uyg'onishda qiynashi mumkin edi. Shuning uchun
  // har bir api() chaqiruvi kuzatiladi va panel fonga o'tgan zahoti hammasi
  // bekor qilinadi (pastga qarang).
  var pendingControllers = [];
  function trackController(c) { if (c) pendingControllers.push(c); }
  function untrackController(c) {
    var idx = pendingControllers.indexOf(c);
    if (idx !== -1) pendingControllers.splice(idx, 1);
  }
  function abortAllPending() {
    pendingControllers.forEach(function (c) { try { c.abort(); } catch (e) {} });
    pendingControllers = [];
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (initDataStr()) headers["X-Telegram-Init-Data"] = initDataStr();
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    trackController(controller);
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 45000) : null;
    return fetch(path, Object.assign({}, opts, { headers: headers, signal: controller ? controller.signal : undefined }))
      .then(function (res) {
        if (timeoutId) clearTimeout(timeoutId);
        untrackController(controller);
        return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .catch(function (err) {
        if (timeoutId) clearTimeout(timeoutId);
        untrackController(controller);
        var isAbort = err && err.name === "AbortError";
        if (isAbort && document.hidden) {
          return { ok: false, status: 0, data: { error: "backgrounded" } };
        }
        showToast(isAbort ? "Server javob bermayapti. Biroz kutib, qaytadan urinib ko'ring." : "Internet aloqasida muammo.");
        return { ok: false, status: 0, data: { error: "network" } };
      });
  }

  document.addEventListener("visibilitychange", function () { if (document.hidden) abortAllPending(); });
  window.addEventListener("pagehide", abortAllPending);

  function photoUrl(fileId) { return "/api/photo/" + encodeURIComponent(fileId); }

  // MUHIM (28-avgust, tuzatildi): AVVAL bu yerda "tg://user?id=..." havolasi
  // ishlatilgan edi - lekin bu Mini App VEB-SAHIFASI ICHIDA Telegram
  // tomonidan BLOKLANADI ("This content is blocked. Contact the site owner
  // to fix the issue." xatosi chiqadi, chunki Mini App'ning WebView'i
  // https bo'lmagan (tg://) havolalarni xavfsizlik sababli navigatsiya
  // qilishga ruxsat bermaydi). Endi buning o'rniga mijozning Telegram
  // @username'idan (agar ma'lum bo'lsa - db.py'dagi remember_username'ga
  // qarang) haqiqiy https://t.me/<username> havolasi ishlatiladi va
  // tg.openTelegramLink() orqali ochiladi - bu Telegram tomonidan RASMAN
  // qo'llab-quvvatlanadi va bloklanmaydi.
  function contactLinkHtml(username) {
    if (username) {
      return '<button class="card-btn" style="margin-top:8px;background:var(--secondary-bg);color:var(--text)" data-contact-username="' + escapeHtml(username) + '">💬 @' + escapeHtml(username) + " bilan bog'lanish</button>";
    }
    // Username hali ma'lum emas (mijoz Telegram'da username o'rnatmagan
    // yoki hali bot bilan yetarlicha muloqot qilmagan) - tugma o'rniga
    // shuni tushuntiruvchi qisqa izoh, chalkashlik bo'lmasin uchun.
    return '<div class="card-line" style="margin-top:6px">📵 Telegram username\'i noma\'lum — faqat telefon orqali bog\'laning</div>';
  }

  function wireContactButtons(container) {
    container.querySelectorAll("[data-contact-username]").forEach(function (btn) {
      btn.onclick = function () {
        var url = "https://t.me/" + btn.getAttribute("data-contact-username");
        if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, "_blank");
      };
    });
  }

  var STATUS_LABELS = {
    "yangi": "🕓 Yangi",
    "to'lov kutilmoqda (karta)": "💳 To'lov kutilmoqda",
    "to'landi (karta)": "💳 To'landi (karta)",
    "to'landi (hamyondan)": "💰 To'landi (hamyondan)",
    "qabul qilindi": "🛠 Yig'ilmoqda",
    "chiqarildi": "🚚 Chiqarib yuborilgan",
    "arxiv": "📁 Yetkazildi (arxiv)",
    "muammo": "⚠️ Muammo",
  };

  var state = { categories: [] };
  var TABS = [
    { key: "orders", label: "📦 Buyurtmalar" },
    { key: "custom", label: "🎨 Shaxsiy" },
    { key: "topups", label: "💰 To'ldirish" },
    { key: "tasks", label: "🎯 Vazifalar" },
    { key: "contacts", label: "💬 Murojaatlar" },
    { key: "customers", label: "👥 Mijozlar" },
    { key: "products", label: "🗂 Mahsulotlar" },
    { key: "colors", label: "🌈 Ranglar" },
    { key: "announcements", label: "📰 Yangiliklar" },
    { key: "stats", label: "📊 Statistika" },
    { key: "settings", label: "⚙️ Sozlamalar" },
  ];
  var activeTab = "orders";
  // FAB (➕) endi bir nechta bo'limda ishlaydi (Mahsulotlar - yangi mahsulot,
  // Yangiliklar - yangi e'lon, Ranglar - yangi filament rangi) - qaysi
  // bo'lim ochiq bo'lsa, o'shanga mos formani ochadi (pastdagi "fab".onclick'ga
  // qarang).
  var FAB_TABS = { products: true, announcements: true, tasks: true, colors: true };

  // 29-avgust (foydalanuvchi so'rovi): "🎯 Vazifalar" uchun ENDI chatga har
  // bir so'rov uchun alohida xabar kelmaydi (minglab bo'lganda chatni
  // to'ldirib tashlamasligi uchun - webapp_api.api_task_submit'ga qarang) -
  // o'rniga shu yerda, sidebar'dagi tugma yonida "(N)" ko'rinishida nechta
  // tekshirilmagan so'rov borligi ko'rsatiladi.
  function refreshTaskPendingCount() {
    api("/admin/api/task_submissions/pending_count").then(function (r) {
      if (!r.ok) return;
      var count = r.data.count || 0;
      var tab = TABS.filter(function (t) { return t.key === "tasks"; })[0];
      if (tab) tab.label = "🎯 Vazifalar" + (count > 0 ? " (" + count + ")" : "");
      renderSidebarNav();
      updateCurrentTabLabel();
    });
  }

  // ---------- 29-avgust: o'ng tomondan chiqadigan menyu ----------
  function renderSidebarNav() {
    var el = document.getElementById("sidebar-items");
    el.innerHTML = TABS.map(function (t) {
      return '<button class="sidebar-item' + (t.key === activeTab ? " active" : "") + '" data-tab="' + t.key + '">' + t.label + '</button>';
    }).join("");
    el.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.onclick = function () {
        activeTab = btn.getAttribute("data-tab");
        closeSidebar();
        renderSidebarNav();
        updateCurrentTabLabel();
        document.getElementById("fab").style.display = FAB_TABS[activeTab] ? "block" : "none";
        loadActiveTab();
      };
    });
  }

  function updateCurrentTabLabel() {
    var t = TABS.filter(function (x) { return x.key === activeTab; })[0];
    document.getElementById("current-tab-label").textContent = t ? t.label : "";
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebar-backdrop").classList.add("open");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebar-backdrop").classList.remove("open");
  }
  document.getElementById("menu-toggle").onclick = function () {
    var sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains("open")) closeSidebar(); else openSidebar();
  };
  document.getElementById("sidebar-backdrop").onclick = closeSidebar;

  function loadActiveTab() {
    var content = document.getElementById("content");
    content.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
    if (activeTab === "orders") loadOrders();
    else if (activeTab === "custom") loadCustomOrders();
    else if (activeTab === "topups") loadTopups();
    else if (activeTab === "tasks") loadTasksTab();
    else if (activeTab === "contacts") loadContactMessages();
    else if (activeTab === "customers") loadCustomers();
    else if (activeTab === "products") loadProducts();
    else if (activeTab === "colors") loadColorsTab();
    else if (activeTab === "announcements") loadAnnouncements();
    else if (activeTab === "stats") loadStats();
    else if (activeTab === "settings") loadSettingsTab();
  }

  // ---------- Buyurtmalar (bosqichli: Qabul qilish -> Yig'ish -> Chiqarib
  // yuborilgan -> Arxiv / Muammo) ----------
  // MUHIM (27-avgust, 2-marta o'zgartirildi): "Arxiv" va "Muammo" AVVAL
  // bitta "final" bo'limda birlashgan edi - endi foydalanuvchi so'roviga
  // ko'ra ALOHIDA-ALOHIDA ikkita bo'lim.
  var ORDER_STAGES = [
    { key: "new", label: "🆕 Qabul qilish" },
    { key: "accepted", label: "🛠 Yig'ish" },
    { key: "shipped", label: "🚚 Chiqarib yuborilgan" },
    { key: "archived", label: "📁 Arxiv" },
    { key: "problem", label: "⚠️ Muammo" },
  ];
  var STAGE_EMPTY_TEXT = {
    new: "Hozircha yangi buyurtma yo'q. 🎉",
    accepted: "Hozircha yig'ilayotgan buyurtma yo'q.",
    shipped: "Hozircha yo'lda buyurtma yo'q.",
    archived: "Hozircha arxivlangan (yetkazilgan) buyurtma yo'q.",
    problem: "Hozircha muammoli buyurtma yo'q. 🎉",
  };
  var ORDER_ACTION_DONE_TEXT = {
    accept: "✅ Qabul qilindi", ship: "🚚 Chiqarib yuborildi",
    archive: "📁 Arxivlandi", problem: "⚠️ Muammo deb belgilandi",
  };
  var activeOrderStage = "new";

  function loadOrders() {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div id="stage-tabs" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">' +
        ORDER_STAGES.map(function (s) {
          return '<button class="tab' + (s.key === activeOrderStage ? " active" : "") + '" data-stage="' + s.key + '" style="flex:none">' + s.label + '</button>';
        }).join("") +
      '</div>' +
      '<div id="stage-content"><div class="empty">Yuklanmoqda...</div></div>';
    content.querySelectorAll("[data-stage]").forEach(function (btn) {
      btn.onclick = function () {
        activeOrderStage = btn.getAttribute("data-stage");
        loadOrders();
      };
    });
    loadOrderStage(activeOrderStage);
  }

  function renderOrderCard(o, stage) {
    var items = [];
    try { items = JSON.parse(o.items_json); } catch (e) {}
    // 29-avgust (foydalanuvchi so'rovi): agar mahsulotga 3D model (STL)
    // havolasi biriktirilgan bo'lsa (buyurtma berilgan paytda "suratga
    // olingan" - db.create_order'ga qarang), har bir band yonida
    // to'g'ridan-to'g'ri o'sha havolaga o'tuvchi "🧊 STL" tugmasi chiqadi -
    // admin buyurtmani yig'ayotganda faylni darhol yuklab olishi uchun.
    // 30-avgust (foydalanuvchi so'rovi): mijoz tanlagan filament rangi ham
    // (yoki "Avtomatik" - mijoz aniq rang tanlamagan bo'lsa) shu yerda
    // ko'rinadi, shunda admin buyurtmani qaysi rangda chop etishni
    // qidirib o'tirmaydi.
    var itemsHtml = items.map(function (i) {
      var stlBtn = i.stl_url
        ? ' <a href="' + escapeHtml(i.stl_url) + '" target="_blank" rel="noopener" ' +
          'style="display:inline-block;margin-left:6px;font-size:12px;background:var(--button);color:var(--button-text);' +
          'padding:3px 9px;border-radius:8px;text-decoration:none;vertical-align:middle">🧊 STL</a>'
        : "";
      var colorLabel = i.color
        ? ' <span style="display:inline-block;margin-left:6px;font-size:12px;background:var(--bg);' +
          'padding:3px 9px;border-radius:8px;vertical-align:middle">🎨 ' + escapeHtml(i.color) + '</span>'
        : ' <span style="display:inline-block;margin-left:6px;font-size:12px;background:var(--bg);' +
          'color:var(--hint);padding:3px 9px;border-radius:8px;vertical-align:middle">🎲 Avtomatik</span>';
      // 30-avgust (foydalanuvchi so'rovi): mijoz yozdirmoqchi bo'lgan matn
      // (bo'lsa) alohida qatorda, aniq ko'rinadigan qilib chiqadi - admin
      // buyurtmani chop etayotganda matnni qidirib o'tirmaydi.
      var textLine = i.custom_text
        ? '<div style="margin-top:4px;font-size:13px;background:var(--bg);border-radius:8px;padding:5px 9px">' +
          '✍️ Matn: <b>' + escapeHtml(i.custom_text) + '</b>' +
          (i.text_price_charged ? ' (+' + fmtPrice(i.text_price_charged) + " so'm)" : '') +
          '</div>'
        : '';
      return '<div>' + escapeHtml(i.name) + ' x' + i.quantity + colorLabel + stlBtn + textLine + '</div>';
    }).join("");
    var statusLabel = STATUS_LABELS[o.status] || o.status;
    var actionsHtml = "";
    if (stage === "new") {
      actionsHtml =
        '<div class="card-actions">' +
          '<button class="card-btn" data-order-action="accept">✅ Qabul qilish</button>' +
          '<button class="card-btn danger" data-order-action="problem">⚠️ Muammo</button>' +
        '</div>';
    } else if (stage === "accepted") {
      actionsHtml =
        '<div class="card-actions">' +
          '<button class="card-btn" data-order-action="ship">🚚 Chiqarib yubordim</button>' +
          '<button class="card-btn danger" data-order-action="problem">⚠️ Muammo</button>' +
        '</div>';
    } else if (stage === "shipped") {
      actionsHtml =
        '<div class="card-actions">' +
          '<button class="card-btn" data-order-action="archive">✅ Yetkazildi</button>' +
          '<button class="card-btn danger" data-order-action="problem">⚠️ Muammo</button>' +
        '</div>';
    }
    // stage === "archived" yoki "problem" uchun amal tugmasi yo'q - bu yakuniy holatlar
    var reasonLine = "";
    if (stage === "problem") {
      reasonLine = '<div class="card-line">📝 Sabab: ' +
        (o.problem_reason ? escapeHtml(o.problem_reason) : "(ko'rsatilmagan)") + '</div>';
    }
    return (
      '<div class="card" data-id="' + o.id + '">' +
        '<div class="card-title">#' + o.id + ' — ' + fmtPrice(o.total_price) + " so'm</div>" +
        '<div class="card-line">' + itemsHtml + '</div>' +
        '<div class="card-line">👤 ' + escapeHtml(o.full_name || "") + ' · 📱 ' + escapeHtml(o.phone || "") + '</div>' +
        '<div class="card-line">📍 ' + escapeHtml(o.address || "") + '</div>' +

  function loadOrderStage(stage) {
    api("/admin/api/orders/stage/" + stage).then(function (r) {
      // Shu orada foydalanuvchi boshqa bo'limga/tabga o'tib ulgurgan bo'lishi mumkin
      if (activeTab !== "orders" || activeOrderStage !== stage) return;
      var stageContent = document.getElementById("stage-content");
      if (!stageContent) return;
      if (!r.ok) { stageContent.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var orders = r.data.orders || [];
      if (!orders.length) { stageContent.innerHTML = '<div class="empty">' + STAGE_EMPTY_TEXT[stage] + '</div>'; return; }
      stageContent.innerHTML = orders.map(function (o) { return renderOrderCard(o, stage); }).join("");
      wireContactButtons(stageContent);
      stageContent.querySelectorAll("[data-order-action]").forEach(function (btn) {
        btn.onclick = function () {
          var card = btn.closest(".card");
          var id = card.getAttribute("data-id");
          var action = btn.getAttribute("data-order-action");
          // "⚠️ Muammo" - darhol belgilamasdan, avval sababni so'raymiz
          // (overlay orqali) - foydalanuvchi so'rovi bilan qo'shildi.
          if (action === "problem") { openProblemReasonForm(id, stage); return; }
          card.querySelectorAll(".card-btn").forEach(function (b) { b.disabled = true; });
          api("/admin/api/orders/" + id + "/" + action, { method: "POST" }).then(function (r2) {
            if (r2.ok) { showToast(ORDER_ACTION_DONE_TEXT[action] || "Belgilandi"); loadOrderStage(stage); }
            else { card.querySelectorAll(".card-btn").forEach(function (b) { b.disabled = false; }); showToast("Xatolik yuz berdi."); }
          });
        };
      });
    });
  }

  // "⚠️ Muammo" bosilganda sababni (izohni) so'rovchi kichik forma (overlay).
  // MUHIM: window.prompt() ishlatilmadi - Telegram Mini App WebView'ida
  // brauzerning standart prompt/alert/confirm oynalari ishonchli
  // ishlamasligi mumkin, shuning uchun mavjud #overlay naqshiga (add-product
  // formasidagi kabi) mos kichik ekran ishlatildi.
  function openProblemReasonForm(orderId, stage) {
    var overlay = document.getElementById("overlay");
    overlay.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">⚠️ Muammo sababi</div>' +
        '<div class="form-group"><label class="form-label">Sabab (ixtiyoriy)</label>' +
          '<textarea class="form-textarea" id="pr-reason" placeholder="Masalan: mijoz javob bermayapti, mahsulot tugagan..."></textarea></div>' +
        '<button class="card-btn danger" id="pr-submit" style="margin-top:6px">⚠️ Muammo deb belgilash</button>' +
        '<button class="card-btn" id="pr-cancel" style="margin-top:8px;background:var(--secondary-bg);color:var(--text)">Bekor qilish</button>' +
      '</div>';
    overlay.classList.remove("hidden");
    if (tg) tg.BackButton.show();

    document.getElementById("pr-cancel").onclick = closeOverlay;
    document.getElementById("pr-submit").onclick = function () {
      var reason = document.getElementById("pr-reason").value.trim();
      var submitBtn = document.getElementById("pr-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Belgilanmoqda...";
      api("/admin/api/orders/" + orderId + "/problem", {
        method: "POST",
        body: JSON.stringify({ reason: reason }),
      }).then(function (r) {
        if (r.ok) {
          showToast("⚠️ Muammo deb belgilandi");
          closeOverlay();
          loadOrderStage(stage);
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = "⚠️ Muammo deb belgilash";
          showToast("Xatolik yuz berdi.");
        }
      });
    };
  }

  // ---------- Shaxsiy buyurtmalar ----------
  // MUHIM (27-avgust, 2-marta o'zgartirildi): "✅ Bog'landim" bosilgan
  // shaxsiy buyurtmalar ENDI yo'qolib qolmaydi - ular arxivga o'tadi va
  // "✅ Bog'lanilgan" tabidan ko'rish mumkin (foydalanuvchi so'rovi:
  // "shaxsiy buyurtmalarni yuqotib yubormasdan arxivga qo'shiladigan qil").
  var CUSTOM_STAGES = [
    { key: "open", label: "🎨 Faol" },
    { key: "archived", label: "✅ Bog'lanilgan" },
  ];
  var activeCustomStage = "open";

  function loadCustomOrders() {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div id="custom-stage-tabs" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">' +
        CUSTOM_STAGES.map(function (s) {
          return '<button class="tab' + (s.key === activeCustomStage ? " active" : "") + '" data-custom-stage="' + s.key + '" style="flex:none">' + s.label + '</button>';
        }).join("") +
      '</div>' +
      '<div id="custom-stage-content"><div class="empty">Yuklanmoqda...</div></div>';

      btn.onclick = function () {
        activeCustomStage = btn.getAttribute("data-custom-stage");
        loadCustomOrders();
      };

  function loadCustomOrderStage(stage) {
    var url = "/admin/api/custom_orders" + (stage === "archived" ? "?archived=1" : "");
    api(url).then(function (r) {
      // Shu orada foydalanuvchi boshqa bo'limga/tabga o'tib ulgurgan bo'lishi mumkin
      if (activeTab !== "custom" || activeCustomStage !== stage) return;
      var stageContent = document.getElementById("custom-stage-content");
      if (!stageContent) return;
      if (!r.ok) { stageContent.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var orders = r.data.orders || [];
      if (!orders.length) {
        stageContent.innerHTML = '<div class="empty">' +
          (stage === "archived" ? "Hozircha bog'lanilgan shaxsiy buyurtma yo'q." : "Hozircha shaxsiy buyurtma so'rovi yo'q.") +
          '</div>';
        return;
      }
      stageContent.innerHTML = orders.map(function (o) {
        return (
          '<div class="card" data-id="' + o.id + '">' +
            '<div class="card-img"><img src="' + photoUrl(o.photo_file_id) + '" style="width:100%;border-radius:10px;margin-bottom:8px"></div>' +
            '<div class="card-title">#' + o.id + '</div>' +
            '<div class="card-line">' + escapeHtml(o.description || "") + '</div>' +
            '<div class="card-line">👤 ' + escapeHtml(o.full_name || "") + ' · 📱 ' + escapeHtml(o.phone || "") + '</div>' +
            '<div class="card-line">📍 ' + escapeHtml(o.address || "") + '</div>' +
            (stage === "open" ? '<div class="card-actions"><button class="card-btn" data-action="contacted">✅ Bog\'landim</button></div>' : '') +
            contactLinkHtml(o.customer_username) +
          '</div>'

      }).join("");
      wireContactButtons(stageContent);
      if (stage === "open") {
        stageContent.querySelectorAll('[data-action="contacted"]').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.closest(".card").getAttribute("data-id");
            btn.disabled = true;
            api("/admin/api/custom_orders/" + id + "/contacted", { method: "POST" }).then(function (r2) {
              if (r2.ok) { showToast("Belgilandi — arxivga o'tdi"); loadCustomOrderStage(stage); }
              else { btn.disabled = false; showToast("Xatolik yuz berdi."); }
            });
          };
        });
      }

  // ---------- Hisob to'ldirish ----------
  // MUHIM (29-avgust, foydalanuvchi so'rovi): skrinshotda/tranzaksiyada
  // ko'rsatilgan summa mijoz botga yozgan summadan farq qilishi mumkin
  // (kam/ko'p tushgan yoki tranzaksiyada xatolik bo'lgan) - shuning uchun
  // "✅ Tasdiqlash" endi HAR DOIM shu kartadagi summani (dastlab so'ralgan
  // summa bilan to'ldirilgan, lekin TAHRIRLANADIGAN input) yuboradi -
  // admin kerak bo'lsa raqamni o'zgartirib, keyin tasdiqlaydi.
  function loadTopups() {
    api("/admin/api/topups").then(function (r) {
      var content = document.getElementById("content");
      if (!r.ok) { content.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var topups = r.data.topups || [];
      var manualHtml =
        '<div class="card">' +
          '<div class="card-title">🧾 Balansni qo\'lda tuzatish</div>' +
          '<div class="card-line">Hisob to\'ldirish so\'roviga bog\'liq bo\'lmagan holda (masalan tranzaksiyada xatolik bo\'lib, so\'rov yaratilmagan bo\'lsa) mijozning hamyoniga to\'g\'ridan-to\'g\'ri pul qo\'shish/ayirish.</div>' +
          '<div class="form-group" style="margin:10px 0 8px"><label class="form-label">Mijoz Telegram ID</label><input class="form-input" id="badj-uid" type="number" inputmode="numeric" placeholder="Masalan: 123456789"></div>' +
          '<div class="form-group" style="margin-bottom:8px"><label class="form-label">Summasi (manfiy son = ayirish)</label><input class="form-input" id="badj-delta" type="number" inputmode="numeric" placeholder="Masalan: 50000 yoki -20000"></div>' +
          '<div class="form-group" style="margin-bottom:0"><label class="form-label">Izoh (ixtiyoriy, mijozga ko\'rinadi)</label><input class="form-input" id="badj-note" placeholder="Masalan: tranzaksiyadagi xatolik uchun"></div>' +
          '<div class="card-actions"><button class="card-btn" id="badj-submit">✅ Qo\'llash</button></div>' +
        '</div>';

      if (!topups.length) {
        content.innerHTML = manualHtml + '<div class="empty">Kutilayotgan so\'rov yo\'q.</div>';
      } else {
        content.innerHTML = manualHtml + topups.map(function (t) {
          return (
            '<div class="card" data-id="' + t.id + '">' +
              (t.screenshot_file_id ? '<img src="' + photoUrl(t.screenshot_file_id) + '" style="width:100%;border-radius:10px;margin-bottom:8px">' : '') +
              '<div class="card-title">#' + t.id + ' — mijoz so\'ragan: ' + fmtPrice(t.amount) + " so'm</div>" +
              '<div class="card-line">Foydalanuvchi ID: ' + t.user_id + '</div>' +
              '<div class="form-group" style="margin:8px 0 0"><label class="form-label">Tasdiqlanadigan summa (kerak bo\'lsa o\'zgartiring)</label>' +
                '<input class="form-input" data-amount-input value="' + t.amount + '" type="number" inputmode="numeric"></div>' +
              '<div class="card-actions">' +
                '<button class="card-btn" data-action="approve">✅ Tasdiqlash</button>' +
                '<button class="card-btn danger" data-action="reject">❌ Rad etish</button>' +
              '</div>' +
            '</div>'
          );
        }).join("");
      }

      document.getElementById("badj-submit").onclick = function () {
        var uid = parseInt(document.getElementById("badj-uid").value, 10);
        var delta = parseInt(document.getElementById("badj-delta").value, 10);
        var note = document.getElementById("badj-note").value.trim();
        if (!uid || !delta) { showToast("Iltimos, Telegram ID va summani to'g'ri kiriting."); return; }
        var btn = document.getElementById("badj-submit");
        btn.disabled = true;
        api("/admin/api/balance_adjust", { method: "POST", body: JSON.stringify({ user_id: uid, delta: delta, note: note || null }) })
          .then(function (r) {
            btn.disabled = false;
            if (r.ok) {
              showToast("✅ Balans yangilandi: " + fmtPrice(r.data.new_balance) + " so'm");
              document.getElementById("badj-uid").value = "";
              document.getElementById("badj-delta").value = "";
              document.getElementById("badj-note").value = "";
            } else if (r.data && r.data.error === "not_found") {
              showToast("Bu ID botda topilmadi - mijoz hali botga /start bosmagan bo'lishi mumkin.");
            } else {
              showToast("Xatolik yuz berdi.");
            }
          });
      };

      content.querySelectorAll('[data-action="approve"],[data-action="reject"]').forEach(function (btn) {
        btn.onclick = function () {
          var card = btn.closest(".card");
          var id = card.getAttribute("data-id");
          var action = btn.getAttribute("data-action");
          var body = {};
          if (action === "approve") {
            var amountInput = card.querySelector("[data-amount-input]");
            var amount = parseInt(amountInput.value, 10);
            if (!amount || amount <= 0) { showToast("Iltimos, to'g'ri summa kiriting."); return; }
            body.amount = amount;
          }
          card.querySelectorAll(".card-btn").forEach(function (b) { b.disabled = true; });
          api("/admin/api/topups/" + id + "/" + action, { method: "POST", body: JSON.stringify(body) }).then(function (r) {
            if (r.ok) { showToast(action === "approve" ? "Tasdiqlandi" : "Rad etildi"); loadTopups(); }
            else { card.querySelectorAll(".card-btn").forEach(function (b) { b.disabled = false; }); showToast("Xatolik yuz berdi."); }
          });
        };
      });
    });
  }

  // ---------- Vazifalar ("🎯 Vazifalar" - tanga/mukofot tizimi, 29-avgust) ----------
  // Instagram/YouTube kabi tarmoqlarda like/obuna/komentariya kabi
  // vazifalar - mijoz bajarib skrinshot yuboradi (webapp/index.html), bu
  // yerda "🆕 Tekshirish" navbatida ko'rinadi. Skrinshot orqali
  // haqiqiyligini 100% avtomatik tekshirib bo'lmaydi (Instagram/YouTube bu
  // ma'lumotni tashqi dasturga bermaydi) - shuning uchun HAR DOIM admin
  // ko'rib tasdiqlaydi/rad etadi. Bir xil rasm boshqa so'rovda ham
  // uchragan bo'lsa ("duplicate_of") - qizil ogohlantirish ko'rsatiladi.
  var TASK_STAGES = [
    { key: "review", label: "🆕 Tekshirish" },
    { key: "ai", label: "🤖 AI tasdiqlagan" },
    { key: "list", label: "📋 Vazifalar" },
  ];
  var activeTaskStage = "review";
  var TASK_PLATFORM_ICON = { instagram: "📸", youtube: "▶️", boshqa: "🔗" };
  var TASK_TYPE_LABEL = {
    like: "👍 Layk bosish", subscribe: "🔔 Obuna bo'lish",
    comment: "💬 Komentariya yozish", repost: "🔁 Ulashish/Repost", boshqa: "✅ Bajarish",
  };
  var AI_VERDICT_LABEL = { ishonchli: "✅ Ishonchli", shubhali: "⚠️ Shubhali", mos_emas: "❌ Mos emas" };

  function aiVerdictLineHtml(s) {
    if (!s.ai_verdict) return "";
    var label = AI_VERDICT_LABEL[s.ai_verdict] || s.ai_verdict;
    return (
      '<div class="card-line" style="background:var(--bg);border-radius:8px;padding:6px 8px;margin-top:6px">' +
        '🤖 AI: <b>' + label + '</b>' + (s.ai_confidence ? " (ishonch: " + escapeHtml(s.ai_confidence) + ")" : "") +
        (s.ai_reasoning ? '<br>' + escapeHtml(s.ai_reasoning) : "") +
      '</div>'
    );
  }

  // ---------- "⚙️ Sozlamalar" bo'limi ----------
  // 29-avgust (foydalanuvchi so'rovi): oldin faqat "🎯 Vazifalar" tabida
  // bo'lgan "🤖 AI tekshiruvi" tugmasi endi shu umumiy Sozlamalar bo'limiga
  // ko'chirildi va kelajakda shunga o'xshash switch'lar ham shu yerga
  // qo'shiladi ("bunday narsalar uchun switch buttonslar qo'shi").
  function loadSettingsTab() {
    var content = document.getElementById("content");
    content.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
    api("/admin/api/settings").then(function (r) {
      if (activeTab !== "settings") return;
      if (!r.ok) { content.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var settings = r.data.settings || [];
      var keyWarn = !r.data.ai_api_key_configured
        ? '<div class="card"><div class="card-line" style="color:#ff3b30">⚠️ ANTHROPIC_API_KEY hali sozlanmagan (Render -> Environment Variables) - shuning uchun "🤖 AI tekshiruvi" yoqilgan bo\'lsa ham hozircha ishlamaydi, hamma so\'rov qo\'lda tekshiriladi.</div></div>'
        : "";
      content.innerHTML = keyWarn + settings.map(function (s) {
        return (
          '<div class="card" data-key="' + s.key + '">' +
            '<div class="card-title">' + s.label + '</div>' +
            '<div class="card-actions"><button class="card-btn' + (s.enabled ? " danger" : "") + '" data-action="toggle">' + (s.enabled ? "⭕ O'chirish" : "✅ Yoqish") + '</button></div>' +
          '</div>'
        );
      }).join("");
      content.querySelectorAll('[data-action="toggle"]').forEach(function (btn) {
        btn.onclick = function () {
          var card = btn.closest(".card");
          var key = card.getAttribute("data-key");
          var currentlyEnabled = btn.textContent.indexOf("O'chirish") !== -1;
          btn.disabled = true;
          api("/admin/api/settings", { method: "POST", body: JSON.stringify({ key: key, enabled: !currentlyEnabled }) }).then(function (r2) {
            if (r2.ok) { showToast(r2.data.enabled ? "Yoqildi" : "O'chirildi"); loadSettingsTab(); }
            else { btn.disabled = false; showToast("Xatolik yuz berdi."); }
          });
        };
      });
    });
  }

  function loadTasksTab() {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">' +
        TASK_STAGES.map(function (s) {
          return '<button class="tab' + (s.key === activeTaskStage ? " active" : "") + '" data-task-stage="' + s.key + '" style="flex:none">' + s.label + '</button>';
        }).join("") +
      '</div>' +
      '<div id="task-stage-content"><div class="empty">Yuklanmoqda...</div></div>';
    content.querySelectorAll("[data-task-stage]").forEach(function (btn) {
      btn.onclick = function () { activeTaskStage = btn.getAttribute("data-task-stage"); loadTasksTab(); };
    });
    if (activeTaskStage === "review") loadTaskReviewQueue();
    else if (activeTaskStage === "ai") loadAiApprovedList();
    else loadTaskList();
    refreshTaskPendingCount();

              '<div class="card-title">' + icon + ' ' + escapeHtml(s.task_title || "") + '</div>' +
              '<div class="card-line">Mukofot: 🎁 ' + fmtPrice(s.task_reward || 0) + " so'm — Foydalanuvchi ID: " + s.user_id + '</div>' +

            '</div>'
          );
        }).join("");

    api("/admin/api/task_submissions").then(function (r) {

            '<div class="card-title">' + icon + ' ' + escapeHtml(s.task_title || "") + '</div>' +

          });

  function loadTaskList() {
    api("/admin/api/tasks").then(function (r) {
      if (activeTab !== "tasks" || activeTaskStage !== "list") return;
      var el = document.getElementById("task-stage-content");
      if (!el) return;
      if (!r.ok) { el.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var items = r.data.tasks || [];
      if (!items.length) { el.innerHTML = '<div class="empty">Hozircha vazifa yo\'q. Pastdagi ➕ orqali qo\'shing.</div>'; return; }
      el.innerHTML = items.map(function (t) {
        var icon = TASK_PLATFORM_ICON[t.platform] || "🔗";
        var isActive = t.status === "faol";

  function submitNewTask() {
    var platform = document.getElementById("tk-platform").value;
    var task_type = document.getElementById("tk-type").value;
    var title = document.getElementById("tk-title").value.trim();
    var description = document.getElementById("tk-desc").value.trim();
    var target_url = document.getElementById("tk-url").value.trim();
    var reward = parseInt(document.getElementById("tk-reward").value, 10);
    var errEl = document.getElementById("tk-error");
    var problems = [];
    if (!title) problems.push("sarlavhani kiriting");
    if (!target_url) problems.push("havolani kiriting");
    if (!reward || reward <= 0) problems.push("mukofotni to'g'ri kiriting");
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var submitBtn = document.getElementById("tk-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Saqlanmoqda...";
    api("/admin/api/tasks", {
      method: "POST",
      body: JSON.stringify({
        platform: platform, task_type: task_type, title: title,
        description: description, target_url: target_url, reward_amount: reward,
      }),
    }).then(function (r) {
      if (r.ok) {
        showToast("Vazifa qo'shildi ✅");
        closeOverlay();
        activeTaskStage = "list";
        loadTasksTab();
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "✅ Saqlash";
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

  // ---------- Murojaatlar/arizalar (29-avgust) ----------
  // Mijoz Mini App'dagi "💬 Operatorga yozish" orqali yozgan xabarlar -
  // ishi bitmaguncha "💬 Ochiq" tabida ko'rinib turadi, "✅ Bajarildi"
  // bosilgach "✅ Bajarilgan" arxiviga o'tadi (xuddi shaxsiy buyurtmalar
  // kabi - foydalanuvchi so'rovi: "ariza haqidagi ma'lumot ishi
  // bitmaguncha admin panelda ko'rinishi kerak").
  var CONTACT_STAGES = [
    { key: "open", label: "💬 Ochiq" },
    { key: "resolved", label: "✅ Bajarilgan" },
  ];
  var activeContactStage = "open";

  function loadContactMessages() {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">' +
        CONTACT_STAGES.map(function (s) {
          return '<button class="tab' + (s.key === activeContactStage ? " active" : "") + '" data-contact-stage="' + s.key + '" style="flex:none">' + s.label + '</button>';
        }).join("") +
      '</div>' +
      '<div id="contact-stage-content"><div class="empty">Yuklanmoqda...</div></div>';
    content.querySelectorAll("[data-contact-stage]").forEach(function (btn) {
      btn.onclick = function () { activeContactStage = btn.getAttribute("data-contact-stage"); loadContactMessages(); };
    });
    loadContactStage(activeContactStage);
  }

  function loadContactStage(stage) {
    var url = "/admin/api/contact_messages" + (stage === "resolved" ? "?resolved=1" : "");
    api(url).then(function (r) {
      if (activeTab !== "contacts" || activeContactStage !== stage) return;
      var el = document.getElementById("contact-stage-content");
      if (!el) return;
      if (!r.ok) { el.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var items = r.data.messages || [];
      if (!items.length) {
        el.innerHTML = '<div class="empty">' +
          (stage === "resolved" ? "Hozircha bajarilgan murojaat yo'q." : "Hozircha ochiq murojaat yo'q. 🎉") +
          '</div>';
        return;
      }
      el.innerHTML = items.map(function (m) {
        return (
          '<div class="card" data-id="' + m.id + '">' +
            '<div class="card-title">#' + m.id + ' — Foydalanuvchi ID: ' + m.user_id + '</div>' +
            '<div class="card-line">' + escapeHtml(m.message) + '</div>' +
            '<div class="card-line" style="opacity:.7">' + escapeHtml(m.created_at || "") + '</div>' +
            (stage === "open" ? '<div class="card-actions"><button class="card-btn" data-action="resolve">✅ Bajarildi</button></div>' : "") +
            contactLinkHtml(m.customer_username) +
          '</div>'
        );
      }).join("");
      wireContactButtons(el);
      if (stage === "open") {
        el.querySelectorAll('[data-action="resolve"]').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.closest(".card").getAttribute("data-id");
            btn.disabled = true;
            api("/admin/api/contact_messages/" + id + "/resolve", { method: "POST" }).then(function (r2) {
              if (r2.ok) { showToast("✅ Bajarildi deb belgilandi"); loadContactStage(stage); }
              else { btn.disabled = false; showToast("Xatolik yuz berdi."); }
            });
          };
        });
      }
    });
  }

  // ---------- Mijozlar (29-avgust) ----------
  // Qidiruv (ID/ism/telefon/username), to'liq ma'lumot (profil + buyurtma
  // tarixi + hisob to'ldirish tarixi), profilni tahrirlash, hamyonni
  // qo'lda tuzatish va bloklash/blokdan chiqarish - hammasi bitta joyda.
  var customersSearchTimer = null;

  function loadCustomers() {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div class="form-group" style="margin-bottom:10px">' +
        '<input class="form-input" id="cust-search" placeholder="Telegram ID, ism, telefon yoki username bo\'yicha qidiring...">' +
      '</div>' +
      '<div id="customers-list"><div class="empty">Yuklanmoqda...</div></div>';
    document.getElementById("cust-search").oninput = function () {
      clearTimeout(customersSearchTimer);
      customersSearchTimer = setTimeout(searchCustomers, 350);
    };
    searchCustomers();
  }

  function searchCustomers() {
    var input = document.getElementById("cust-search");
    var q = input ? input.value : "";
    api("/admin/api/customers?q=" + encodeURIComponent(q)).then(function (r) {
      if (activeTab !== "customers") return;
      var el = document.getElementById("customers-list");
      if (!el) return;
      if (!r.ok) { el.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var users = r.data.users || [];
      if (!users.length) { el.innerHTML = '<div class="empty">Mijoz topilmadi.</div>'; return; }
      el.innerHTML = users.map(function (u) {
        var name = u.full_name || "(ism kiritilmagan)";
        var blockedBadge = u.blocked ? ' <span style="color:#ff3b30;font-weight:700">🚫 Bloklangan</span>' : "";
        return (
          '<div class="card" data-uid="' + u.user_id + '" style="cursor:pointer">' +
            '<div class="card-title">' + escapeHtml(name) + blockedBadge + '</div>' +
            '<div class="card-line">ID: ' + u.user_id + (u.username ? ' · @' + escapeHtml(u.username) : '') + '</div>' +
            '<div class="card-line">📱 ' + escapeHtml(u.phone || "—") + '</div>' +
            '<div class="card-line">💰 ' + fmtPrice(u.balance || 0) + " so'm</div>" +
          '</div>'
        );
      }).join("");
      el.querySelectorAll("[data-uid]").forEach(function (card) {
        card.onclick = function () { openCustomerDetail(Number(card.getAttribute("data-uid"))); };
      });
    });
  }

  function openCustomerDetail(userId) {
    var overlay = document.getElementById("overlay");
    overlay.innerHTML = '<div class="screen"><div class="empty">Yuklanmoqda...</div></div>';
    overlay.classList.remove("hidden");
    if (tg) tg.BackButton.show();
    api("/admin/api/customers/" + userId).then(function (r) {
      if (!r.ok) { overlay.innerHTML = '<div class="screen"><div class="empty">Yuklab bo\'lmadi.</div></div>'; return; }
      renderCustomerDetail(overlay, r.data);
    });

  var TOPUP_STATUS_LABELS = {
    "kutilmoqda": "🕓 Kutilmoqda",
    "tasdiqlandi": "✅ Tasdiqlandi",
    "rad etildi": "❌ Rad etildi",
  };

  function renderCustomerDetail(overlay, data) {
    var p = data.profile;
    var orders = data.orders || [];
    var topups = data.topups || [];
    var ordersHtml = orders.length
      ? orders.map(function (o) {
          var statusLabel = STATUS_LABELS[o.status] || o.status;
          return '<div class="card-line">#' + o.id + ' — ' + fmtPrice(o.total_price) + " so'm — " + statusLabel + '</div>';
        }).join("")
      : '<div class="card-line">Hali buyurtma yo\'q.</div>';
    var topupsHtml = topups.length
      ? topups.map(function (t) {
          var statusLabel = TOPUP_STATUS_LABELS[t.status] || t.status;
          var amt = (t.approved_amount != null) ? t.approved_amount : t.amount;
          return '<div class="card-line">#' + t.id + ' — ' + fmtPrice(amt) + " so'm — " + statusLabel + '</div>';
        }).join("")
      : '<div class="card-line">Hali so\'rov yo\'q.</div>';

    overlay.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">👤 Mijoz #' + p.user_id + (p.username ? ' (@' + escapeHtml(p.username) + ')' : '') + '</div>' +

        '<div class="form-group"><label class="form-label">Ism-familiya</label><input class="form-input" id="cd-name" value="' + escapeHtml(p.full_name || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="cd-phone" value="' + escapeHtml(p.phone || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Manzil</label><input class="form-input" id="cd-address" value="' + escapeHtml(p.address || "") + '"></div>' +
        '<button class="card-btn" id="cd-save-profile" style="margin-bottom:16px">✅ Ma\'lumotlarni saqlash</button>' +

        '<div class="card">' +
          '<div class="card-title">💰 Hamyon: ' + fmtPrice(p.balance || 0) + " so'm</div>" +
          '<div class="form-group" style="margin:10px 0 8px"><label class="form-label">Tuzatish summasi (manfiy son = ayirish)</label>' +
            '<input class="form-input" id="cd-delta" type="number" inputmode="numeric" placeholder="Masalan: 50000 yoki -20000"></div>' +
          '<div class="form-group" style="margin-bottom:0"><label class="form-label">Izoh (ixtiyoriy, mijozga ko\'rinadi)</label><input class="form-input" id="cd-note"></div>' +
          '<div class="card-actions"><button class="card-btn" id="cd-adjust">✅ Qo\'llash</button></div>' +
        '</div>' +

        '<div class="card"><div class="card-title">📦 Buyurtmalar</div>' + ordersHtml + '</div>' +
        '<div class="card"><div class="card-title">💳 Hisob to\'ldirish tarixi</div>' + topupsHtml + '</div>' +

        '<button class="card-btn' + (p.blocked ? '' : ' danger') + '" id="cd-block" style="margin-top:6px">' +
          (p.blocked ? "✅ Blokdan chiqarish" : "🚫 Bloklash") +
        '</button>' +
      '</div>';

    document.getElementById("cd-save-profile").onclick = function () {
      var btn = document.getElementById("cd-save-profile");
      btn.disabled = true;
      api("/admin/api/customers/" + p.user_id + "/profile", {
        method: "POST",
        body: JSON.stringify({
          full_name: document.getElementById("cd-name").value.trim(),
          phone: document.getElementById("cd-phone").value.trim(),
          address: document.getElementById("cd-address").value.trim(),
        }),
      }).then(function (r) {
        btn.disabled = false;
        if (r.ok) showToast("Saqlandi ✅"); else showToast("Xatolik yuz berdi.");
      });
    };

    document.getElementById("cd-adjust").onclick = function () {
      var delta = parseInt(document.getElementById("cd-delta").value, 10);
      var note = document.getElementById("cd-note").value.trim();
      if (!delta) { showToast("Iltimos, summani to'g'ri kiriting."); return; }
      var btn = document.getElementById("cd-adjust");
      btn.disabled = true;
      api("/admin/api/balance_adjust", { method: "POST", body: JSON.stringify({ user_id: p.user_id, delta: delta, note: note || null }) }).then(function (r) {
        btn.disabled = false;
        if (r.ok) { showToast("✅ Balans yangilandi: " + fmtPrice(r.data.new_balance) + " so'm"); openCustomerDetail(p.user_id); }
        else showToast("Xatolik yuz berdi.");
      });
    };

    document.getElementById("cd-block").onclick = function () {
      var newBlocked = !p.blocked;
      var btn = document.getElementById("cd-block");
      btn.disabled = true;
      api("/admin/api/customers/" + p.user_id + "/block", { method: "POST", body: JSON.stringify({ blocked: newBlocked }) }).then(function (r) {
        btn.disabled = false;
        if (r.ok) { showToast(newBlocked ? "🚫 Bloklandi" : "✅ Blokdan chiqarildi"); openCustomerDetail(p.user_id); }
        else showToast("Xatolik yuz berdi.");
      });
    };
  }

  // ---------- Mahsulotlar ----------
  // MUHIM: state.categories endi {name, subcategories: [...]} obyektlar
  // ro'yxati (webapp_api.py'dagi /api/catalog javobi 27-avgustda shunga
  // o'zgartirilgan - "katalog ichida katalog" so'roviga javoban).
  // 30-avgust (foydalanuvchi so'rovi): mahsulotni tahrirlash formasi shu
  // ro'yxatdagi to'liq ma'lumotdan (qayta so'rov yubormasdan) to'ldiriladi.
  var _loadedProducts = [];

  function loadProducts() {
    Promise.all([api("/admin/api/products"), state.categories.length ? Promise.resolve() : api("/api/catalog").then(function (r) { state.categories = (r.data && r.data.categories) || []; })])
      .then(function (results) {
        var r = results[0];
        var content = document.getElementById("content");
        if (!r.ok) { content.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
        var products = r.data.products || [];
        _loadedProducts = products;
        if (!products.length) { content.innerHTML = '<div class="empty">Hozircha mahsulot yo\'q. Pastdagi ➕ orqali qo\'shing.</div>'; return; }
        content.innerHTML = products.map(function (p) {
          var img = (p.photos && p.photos[0]) ? '<img src="' + photoUrl(p.photos[0]) + '" style="width:56px;height:56px;border-radius:10px;object-fit:cover;float:left;margin-right:10px">' : "";
          var catLine = escapeHtml(p.category) + (p.subcategory ? " / " + escapeHtml(p.subcategory) : "") + ' · ' + fmtPrice(p.price) + " so'm";
          var textLine = p.allow_text_customization
            ? '<div class="card-line">✍️ Matn yozdirish: +' + fmtPrice(p.text_price || 0) + " so'm (maks. " + (p.max_text_length || 0) + " belgi)</div>"
            : "";
          return (
            '<div class="card" data-id="' + p.id + '" style="overflow:auto">' +
              img +
              '<div class="card-title">' + escapeHtml(p.name) + '</div>' +
              '<div class="card-line">' + catLine + '</div>' +
              textLine +
              '<div class="card-actions">' +
                '<button class="card-btn" data-action="edit">✏️ Tahrirlash</button>' +
                '<button class="card-btn danger" data-action="delete">🗑 O\'chirish</button>' +
              '</div>' +
            '</div>'
          );
        }).join("");
        content.querySelectorAll('[data-action="delete"]').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.closest(".card").getAttribute("data-id");
            btn.disabled = true;
            api("/admin/api/products/" + id + "/delete", { method: "POST" }).then(function (r) {
              if (r.ok) { showToast("O'chirildi"); loadProducts(); }
              else { btn.disabled = false; showToast("Xatolik yuz berdi."); }
            });
          };
        });
        content.querySelectorAll('[data-action="edit"]').forEach(function (btn) {
          btn.onclick = function () {
            var id = Number(btn.closest(".card").getAttribute("data-id"));
            var product = _loadedProducts.filter(function (x) { return x.id === id; })[0];
            if (product) openEditProductForm(product);
          };
        });
      });
  }

  // ---------- Filament ranglari (30-avgust, foydalanuvchi so'rovi) ----------

  // 30-avgust (foydalanuvchi so'rovi): rangda xato bo'lsa, o'chirib qayta
  // qo'shmasdan to'g'ridan-to'g'ri nomini tahrirlash uchun. DIQQAT: eski
  // buyurtmalardagi tanlov (items_json'ga "suratga olingan") bilan
  // O'ZGARMAYDI - faqat bundan keyingi tanlovlarda yangi nom ko'rinadi.
  function openRenameColorForm(color) {
    var overlay = document.getElementById("overlay");
    overlay.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">✏️ Rang nomini o\'zgartirish</div>' +
        '<div class="form-group"><label class="form-label">Rang nomi</label>' +
          '<input class="form-input" id="c-name" value="' + escapeHtml(color.name) + '"></div>' +
        '<div class="form-hint">Eski buyurtmalarda saqlangan tanlov o\'zgarmaydi - faqat bundan keyingi tanlovlarda yangi nom ko\'rinadi.</div>' +
        '<div class="form-error hidden" id="c-error"></div>' +
        '<button class="card-btn" id="c-submit" style="margin-top:6px">✅ Saqlash</button>' +
        '<button class="card-btn" id="c-cancel" style="margin-top:8px;background:var(--secondary-bg);color:var(--text)">Bekor qilish</button>' +
      '</div>';
    overlay.classList.remove("hidden");
    if (tg) tg.BackButton.show();
    document.getElementById("c-cancel").onclick = closeOverlay;
    document.getElementById("c-submit").onclick = function () { submitRenameColor(color.id); };

  // 30-avgust (foydalanuvchi so'rovi): "✍️ Matn yozdirish" bo'limi - HAMMA
  // mahsulotda emas, admin har birida alohida yoqadi. Yoqilsa, maksimal
  // belgilar soni va qo'shimcha narxni MAJBURIY kiritish kerak. Bir xil
  // markup ham qo'shish, ham tahrirlash formasida ishlatiladi.
  function _textCustomizationFieldsHtml(p) {
    var allow = p ? !!p.allow_text_customization : false;
    return (
      '<div class="form-group"><label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
        '<input type="checkbox" id="p-text-allow" style="width:auto"' + (allow ? " checked" : "") + '> ' +
        '✍️ Matn yozdirish imkoniyati (qo\'shimcha to\'lov bilan)' +
      '</label></div>' +
      '<div id="p-text-fields" style="display:' + (allow ? "block" : "none") + '">' +
        '<div class="form-group"><label class="form-label">Maksimal belgilar soni</label>' +
          '<input class="form-input" id="p-text-maxlen" type="number" placeholder="Masalan: 20" value="' + (p && p.max_text_length ? p.max_text_length : "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Matn uchun qo\'shimcha narx (so\'m)</label>' +
          '<input class="form-input" id="p-text-price" type="number" placeholder="Masalan: 10000" value="' + (p && p.text_price != null ? p.text_price : "") + '"></div>' +
      '</div>'
    );
  }

  function _wireTextCustomizationToggle() {
    document.getElementById("p-text-allow").onchange = function () {
      document.getElementById("p-text-fields").style.display = this.checked ? "block" : "none";
    };
  }

  // `problems` massiviga xato bo'lsa matn qo'shadi. Qaytaradi:
  // {allow_text_customization, max_text_length, text_price}.
  function _readTextCustomizationFields(problems) {
    var allow = document.getElementById("p-text-allow").checked;
    if (!allow) return { allow_text_customization: false, max_text_length: null, text_price: null };
    var maxLen = parseInt(document.getElementById("p-text-maxlen").value.trim(), 10);
    var textPrice = parseInt(document.getElementById("p-text-price").value.trim(), 10);
    if (!maxLen || maxLen <= 0) problems.push("matn uchun maksimal belgilar sonini to'g'ri kiriting");
    if (isNaN(textPrice) || textPrice < 0) problems.push("matn uchun qo'shimcha narxni to'g'ri kiriting");
    return { allow_text_customization: true, max_text_length: maxLen, text_price: textPrice };
  }

  function _categoryDatalistsHtml() {
    var catOptions = state.categories.map(function (c) { return '<option value="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</option>'; }).join("");
    // Mavjud barcha kichik bo'limlar (qaysi bo'limga tegishli bo'lishidan
    // qat'i nazar) - qulaylik uchun bitta umumiy ro'yxat sifatida taklif
    // qilinadi (admin baribir o'zi to'g'ri bo'limni tanlaydi).
    var allSubcats = [];
    state.categories.forEach(function (c) {
      (c.subcategories || []).forEach(function (s) { if (allSubcats.indexOf(s) === -1) allSubcats.push(s); });
    });
    var subcatOptions = allSubcats.map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join("");
    return { catOptions: catOptions, subcatOptions: subcatOptions };
  }

  function submitNewProduct() {
    var category = document.getElementById("p-category").value.trim();
    var subcategory = document.getElementById("p-subcategory").value.trim();
    var name = document.getElementById("p-name").value.trim();
    var description = document.getElementById("p-desc").value.trim();
    var priceStr = document.getElementById("p-price").value.trim();
    var stlUrl = document.getElementById("p-stl-url").value.trim();
    var errEl = document.getElementById("p-error");
    var problems = [];
    if (!category) problems.push("bo'limni kiriting");
    if (!name) problems.push("nomini kiriting");
    var price = parseInt(priceStr, 10);
    if (!price || price <= 0) problems.push("narxini to'g'ri kiriting");
    if (!pickedPhotos.length) problems.push("kamida 1 ta rasm tanlang");
    var textFields = _readTextCustomizationFields(problems);
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var submitBtn = document.getElementById("p-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Saqlanmoqda...";
    api("/admin/api/products", {
      method: "POST",
      body: JSON.stringify(Object.assign({
        category: category, subcategory: subcategory, name: name, description: description,
        price: price, stl_url: stlUrl || null, photos: pickedPhotos,
      }, textFields)),
    }).then(function (r) {
      if (r.ok) {
        showToast("Mahsulot qo'shildi ✅");
        closeOverlay();
        state.categories = [];
        loadProducts();
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "✅ Saqlash";
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

    var name = document.getElementById("p-name").value.trim();
    var description = document.getElementById("p-desc").value.trim();
    var priceStr = document.getElementById("p-price").value.trim();
    var stlUrl = document.getElementById("p-stl-url").value.trim();
    var errEl = document.getElementById("p-error");
    var problems = [];
    if (!category) problems.push("bo'limni kiriting");
    if (!name) problems.push("nomini kiriting");
    var price = parseInt(priceStr, 10);
    if (!price || price <= 0) problems.push("narxini to'g'ri kiriting");
    var textFields = _readTextCustomizationFields(problems);
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    var submitBtn = document.getElementById("p-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Saqlanmoqda...";
    api("/admin/api/products/" + productId + "/update", {
      method: "POST",
      body: JSON.stringify(Object.assign({
        category: category, subcategory: subcategory, name: name, description: description,
        price: price, stl_url: stlUrl || null,
      }, textFields)),
    }).then(function (r) {
      if (r.ok) {
        showToast("Saqlandi ✅");
        closeOverlay();
        state.categories = [];
        loadProducts();
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "✅ Saqlash";
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

  document.getElementById("fab").onclick = function () {
    if (activeTab === "announcements") openAddAnnouncementForm();
    else if (activeTab === "tasks") openAddTaskForm();
    else if (activeTab === "colors") openAddColorForm();
    else openAddProductForm();
  };
  if (tg) tg.BackButton.onClick(closeOverlay);

  // ---------- Kirish tekshiruvi ----------
  function showLocked() {
    document.getElementById("app").innerHTML =
      '<div class="lockscreen"><div class="icon">🔒</div><h2>Kirish taqiqlangan</h2>' +
      '<p style="color:var(--hint);font-size:14.5px">Bu panel faqat ruxsat etilgan adminlar uchun.</p></div>';
    document.getElementById("fab").style.display = "none";
    document.getElementById("menu-toggle").style.display = "none";
  }

  api("/admin/api/orders?open=1").then(function (r) {
    if (r.status === 401) { showLocked(); return; }
    renderSidebarNav();
    updateCurrentTabLabel();
    loadActiveTab();
    refreshTaskPendingCount();
  });
})();
</script>
</body>
</html>
