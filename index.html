<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Figo3D Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --hint: #8e8e93;
    --link: #2ea6ff;
    --button: #2ea6ff;
    --button-text: #ffffff;
    --secondary-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { min-height: 100vh; padding-bottom: 150px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 14px 0; }
  header h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
  #tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: none; border-radius: 999px; padding: 8px 16px;
    background: var(--secondary-bg); color: var(--text); font-size: 14px; font-weight: 500;
  }
  .tab.active { background: var(--button); color: var(--button-text); }

  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px; }
  .empty, .cart-empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 40px 20px; font-size: 15px; }

  .card { background: var(--secondary-bg); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card-img { aspect-ratio: 1 / 1; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .noimg { font-size: 34px; opacity: 0.5; }
  .noimg.big { font-size: 64px; padding: 60px 0; }
  .noimg.small { font-size: 20px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 10px; }
  .card-body { padding: 8px 10px 4px; flex: 1; }
  .card-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .card-price { font-size: 13px; color: var(--hint); }
  .card-action { padding: 8px 10px 10px; }
  .add-btn {
    width: 100%; border: none; border-radius: 10px; padding: 8px 0;
    background: var(--button); color: var(--button-text); font-size: 13px; font-weight: 600;
  }
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--button); border-radius: 10px; padding: 4px 6px; color: var(--button-text);
  }
  .stepper button {
    border: none; background: transparent; color: var(--button-text); font-size: 18px;
    width: 26px; height: 26px; line-height: 1;
  }
  .stepper span { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }

  #overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 20;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #overlay.hidden { display: none; }
  .screen { padding: 14px 16px 30px; }
  .screen-title { font-size: 19px; font-weight: 700; margin: 4px 0 16px; }

  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .gallery img { width: 100%; flex: none; scroll-snap-align: start; aspect-ratio: 1 / 1; object-fit: cover; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); opacity: 0.4; }
  .dot.active { opacity: 1; background: var(--button); }
  .detail-body { padding: 4px 16px 20px; }
  .detail-body h2 { font-size: 19px; margin: 6px 0 8px; }
  .detail-desc { font-size: 14.5px; color: var(--hint); line-height: 1.5; margin: 0 0 14px; white-space: pre-wrap; }
  .detail-price { font-size: 18px; font-weight: 700; }

  .cart-list { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px; }
  .cart-row { display: flex; align-items: center; gap: 10px; background: var(--secondary-bg); border-radius: 14px; padding: 8px; }
  .cart-row-img { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; }
  .cart-row-img img { width: 100%; height: 100%; object-fit: cover; }
  .cart-row-info { flex: 1; min-width: 0; }
  .cart-row-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .cart-row-price { font-size: 12.5px; color: var(--hint); margin-top: 2px; }
  .cart-total { padding: 18px 16px 8px; font-size: 16px; font-weight: 700; text-align: right; }

  .option-btn {
    display: block; width: 100%; text-align: left; border: none; border-radius: 14px;
    background: var(--secondary-bg); color: var(--text); padding: 16px; font-size: 15px;
    font-weight: 600; margin-bottom: 10px;
  }
  .option-btn .sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--hint); margin-top: 3px; }
  .option-btn:disabled { opacity: 0.4; }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12.5px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
  .form-input {
    width: 100%; border: none; border-radius: 12px; background: var(--secondary-bg);
    color: var(--text); padding: 13px 14px; font-size: 15px; font-family: inherit;
  }
  .form-input:focus { outline: 2px solid var(--button); }
  .form-error { color: #ff3b30; font-size: 12.5px; margin-top: 6px; }

  .promo-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .promo-row .form-input { flex: 1; }
  .promo-check-btn {
    border: none; border-radius: 12px; background: var(--button); color: var(--button-text);
    padding: 0 16px; font-size: 14px; font-weight: 600;
  }
  .promo-result { font-size: 13.5px; margin-top: 4px; }
  .promo-result.ok { color: #34c759; }
  .promo-result.bad { color: #ff3b30; }

  .summary-box { background: var(--secondary-bg); border-radius: 14px; padding: 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.7; }
  .summary-box .row { display: flex; justify-content: space-between; }
  .summary-box .total { font-weight: 700; font-size: 16px; margin-top: 6px; }

  /* Telegram'ning o'z (sahifadan tashqarida chiziladigan) "MainButton"iga
     QO'SHIMCHA ravishda, HAR bir muhim qadamda sahifaning O'ZIDA ham oddiy
     HTML tugma ko'rsatiladi - ba'zi Telegram mijozlarida (masalan Telegram
     Web/brauzer orqali) MainButton bosilishi har doim ham kutilganidek
     ishlayvermasligi mumkin ekan, shuning uchun buyurtma berish HECH QACHON
     faqat bitta (ishonchsiz) tugmaga bog'liq bo'lib qolmasligi kerak. */
  .page-cta {
    display: block; width: 100%; border: none; border-radius: 14px;
    background: var(--button); color: var(--button-text); padding: 15px;
    font-size: 15.5px; font-weight: 700; margin: 18px 0 4px;
  }
  .page-cta:disabled { opacity: 0.55; }

  .center-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; min-height: 70vh; }
  .center-screen .icon { font-size: 52px; margin-bottom: 16px; }
  .center-screen h2 { font-size: 19px; margin: 0 0 8px; }
  .center-screen p { color: var(--hint); font-size: 14.5px; line-height: 1.5; margin: 0; }

  #toast {
    position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 50;
    background: #1c1c1e; color: #ffffff; padding: 13px 16px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.4; box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    transform: translateY(140%); transition: transform 0.25s ease;
  }
  #toast.show { transform: translateY(0); }

  .btn-spinner {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    display: flex; background: var(--bg); border-top: 1px solid rgba(128,128,128,0.18);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .navbtn {
    flex: 1; border: none; background: transparent; color: var(--hint);
    font-size: 10.5px; padding: 6px 2px 2px; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
  }
  .navbtn .navicon { font-size: 20px; }
  .navbtn.active { color: var(--button); }
  #tabcontent { padding: 4px 14px 90px; }
  #tabcontent.hidden { display: none; }
  #grid.hidden, #tabs.hidden { display: none; }

  .profile-box { background: var(--secondary-bg); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .profile-balance { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .order-card { background: var(--secondary-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .order-card .oc-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .order-card .oc-line { font-size: 12.5px; color: var(--hint); line-height: 1.5; }
  .section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎁 Figo3D</h1>
    <div id="tabs"></div>
  </header>
  <main id="grid"></main>
  <div id="tabcontent" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
</div>
<nav id="bottomnav"></nav>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  function themeVar(name, fallback) {
    return (tg && tg.themeParams && tg.themeParams[name]) ? tg.themeParams[name] : fallback;
  }
  function applyTheme() {
    var root = document.documentElement.style;
    root.setProperty("--bg", themeVar("bg_color", "#ffffff"));
    root.setProperty("--text", themeVar("text_color", "#111111"));
    root.setProperty("--hint", themeVar("hint_color", "#8e8e93"));
    root.setProperty("--link", themeVar("link_color", "#2ea6ff"));
    root.setProperty("--button", themeVar("button_color", "#2ea6ff"));
    root.setProperty("--button-text", themeVar("button_text_color", "#ffffff"));
    root.setProperty("--secondary-bg", themeVar("secondary_bg_color", "#f4f4f5"));
  }
  applyTheme();
  if (tg) tg.onEvent("themeChanged", applyTheme);

  // ---------- Holat ----------
  var state = {
    categories: [], products: [], cart: {},
    detailProduct: null,
    cardEnabled: false,
    contactInfo: "", paymentInfo: "",
    profile: null,
    orders: null,
    mainTab: "katalog", // "katalog" | "custom" | "orders" | "profile"
    customForm: { photo: null, description: "", full_name: "", phone: "", address: "" },
    topupForm: { amount: "", screenshot: null },
    checkout: { full_name: "", phone: "", address: "", promo_code: null, discount_percent: 0, discount_amount: 0 },
  };
  var navStack = []; // bo'sh = joriy mainTab'ning asosiy ko'rinishi

  function fmtPrice(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initDataStr() { return tg ? tg.initData : ""; }

  // Bitta joyda ko'rinadigan xato/ogohlantirish xabari - tarmoq/server
  // muammosi YUZ BERGANDA hech narsa ko'rsatmasdan "jim" qolib ketmaslik
  // uchun (aynan shu narsa avvalgi xato sababi edi: sekin/uxlab qolgan
  // Render server javob bermaganda hech qanday xabar chiqmasdi).
  var toastTimer = null;
  function showToast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 5000);
  }

  // {ok, status, data} qaytaradi - xato holatini ham chaqiruvchi o'zi ko'rib chiqishi mumkin.
  // Render'ning bepul tarifi uzoq ishlatilmasa "uxlab qoladi" va birinchi
  // so'rovga javob berish 30-60 soniyagacha cho'zilishi mumkin - shuning
  // uchun 45 soniyagacha kutamiz (darhol "ishlamayapti" deb hisoblamaymiz),
  // lekin abadiy osilib qolmasligi uchun shu muddatdan keyin to'xtatamiz.
  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (initDataStr()) headers["X-Telegram-Init-Data"] = initDataStr();
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 45000) : null;
    return fetch(path, Object.assign({}, opts, { headers: headers, signal: controller ? controller.signal : undefined }))
      .then(function (res) {
        if (timeoutId) clearTimeout(timeoutId);
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok, status: res.status, data: data };
        });
      })
      .catch(function (err) {
        if (timeoutId) clearTimeout(timeoutId);
        var isAbort = err && err.name === "AbortError";
        showToast(
          isAbort
            ? "Server javob bermayapti (uxlab qolgan bo'lishi mumkin). Biroz kutib, qaytadan urinib ko'ring."
            : "Internet aloqasida muammo. Qaytadan urinib ko'ring."
        );
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return { ok: false, status: 0, data: { error: "network" } };
      });
  }

  function photoUrl(fileId) { return "/api/photo/" + encodeURIComponent(fileId); }

  // ---------- Navigatsiya ----------
  function currentView() { return navStack.length ? navStack[navStack.length - 1] : "grid"; }
  function pushView(name) { navStack.push(name); render(); }
  function popView() { if (navStack.length) navStack.pop(); render(); }
  function resetToGrid() { navStack = []; state.mainTab = "katalog"; renderBottomNav(); switchTabView(); render(); renderGrid(); }

  // ---------- Asosiy tab (pastki navigatsiya): Katalog / Shaxsiy / Buyurtmalar / Profil ----------
  var MAIN_TABS = [
    { key: "katalog", icon: "🗂", label: "Katalog" },
    { key: "custom", icon: "🎨", label: "Shaxsiy" },
    { key: "orders", icon: "📦", label: "Buyurtmalar" },
    { key: "profile", icon: "👤", label: "Profil" },
  ];

  function renderBottomNav() {
    var el = document.getElementById("bottomnav");
    el.innerHTML = MAIN_TABS.map(function (t) {
      return (
        '<button class="navbtn' + (state.mainTab === t.key ? " active" : "") + '" data-tab="' + t.key + '">' +
          '<span class="navicon">' + t.icon + '</span><span>' + t.label + '</span>' +
        '</button>'
      );
    }).join("");
    el.querySelectorAll(".navbtn").forEach(function (btn) {
      btn.onclick = function () { switchMainTab(btn.getAttribute("data-tab")); };
    });
  }

  function switchTabView() {
    var grid = document.getElementById("grid");
    var tabsEl = document.getElementById("tabs");
    var tabcontent = document.getElementById("tabcontent");
    if (state.mainTab === "katalog") {
      grid.classList.remove("hidden");
      tabsEl.classList.remove("hidden");
      tabcontent.classList.add("hidden");
    } else {
      grid.classList.add("hidden");
      tabsEl.classList.add("hidden");
      tabcontent.classList.remove("hidden");
      renderTabContent();
    }
  }

  function switchMainTab(tab) {
    if (tab === state.mainTab && navStack.length === 0) return;
    navStack = [];
    state.mainTab = tab;
    renderBottomNav();
    switchTabView();
    render();
  }

  function renderTabContent() {
    var el = document.getElementById("tabcontent");
    if (state.mainTab === "custom") renderCustomTab(el);
    else if (state.mainTab === "orders") renderOrdersTab(el);
    else if (state.mainTab === "profile") renderProfileTab(el);
  }

  if (tg) {
    tg.BackButton.onClick(function () { popView(); });
  }

  var VIEW_RENDERERS = {}; // to'ldiriladi (pastda)

  function render() {
    var view = currentView();
    var overlay = document.getElementById("overlay");
    if (view === "grid") {
      overlay.classList.add("hidden");
      overlay.innerHTML = "";
      if (tg) tg.BackButton.hide();
    } else {
      overlay.classList.remove("hidden");
      if (tg) tg.BackButton.show();
      (VIEW_RENDERERS[view] || function () {})(overlay);
    }
    updateMainButton();
  }

  // ---------- Yuklash ----------
  function loadCatalog() {
    return api("/api/catalog").then(function (r) {
      state.categories = (r.data && r.data.categories) || [];
      state.products = (r.data && r.data.products) || [];
    });
  }
  function loadCart() {
    return api("/api/cart").then(function (r) {
      state.cart = {};
      if (r.ok) ((r.data && r.data.items) || []).forEach(function (i) { state.cart[i.product_id] = i.quantity; });
    });
  }
  function loadConfig() {
    return api("/api/config").then(function (r) {
      state.cardEnabled = !!(r.data && r.data.card_enabled);
      state.contactInfo = (r.data && r.data.contact_info) || "";
      state.paymentInfo = (r.data && r.data.payment_info) || "";
    });
  }
  function loadProfile() {
    return api("/api/profile").then(function (r) { if (r.ok) state.profile = r.data; });
  }

  // ---------- Katalog to'ri ----------
  var activeCategory = null;

  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = "";
    state.categories.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.className = "tab" + (cat === activeCategory ? " active" : "");
      btn.textContent = cat;
      btn.onclick = function () { activeCategory = cat; renderTabs(); renderGrid(); };
      el.appendChild(btn);
    });
  }

  function renderGrid() {
    var el = document.getElementById("grid");
    el.innerHTML = "";
    var items = state.products.filter(function (p) { return p.category === activeCategory; });
    if (!items.length) {
      el.innerHTML = "<div class=\"empty\">Bu bo'limda hozircha mahsulot yo'q</div>";
      return;
    }
    items.forEach(function (p) {
      var qty = state.cart[p.id] || 0;
      var card = document.createElement("div");
      card.className = "card";
      var img = (p.photos && p.photos[0])
        ? '<img src="' + photoUrl(p.photos[0]) + '" loading="lazy">'
        : '<div class="noimg">🎁</div>';
      card.innerHTML =
        '<div class="card-img">' + img + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="card-price">' + fmtPrice(p.price) + " so'm</div>" +
        '</div>' +
        '<div class="card-action">' +
          (qty > 0
            ? '<div class="stepper"><button class="dec">−</button><span>' + qty + '</span><button class="inc">+</button></div>'
            : '<button class="add-btn">➕ Qo\'shish</button>') +
        '</div>';
      card.querySelector(".card-img").onclick = function () { openDetail(p); };
      card.querySelector(".card-name").onclick = function () { openDetail(p); };
      var addBtn = card.querySelector(".add-btn");
      if (addBtn) addBtn.onclick = function (e) { e.stopPropagation(); changeQty(p.id, 1); };
      var dec = card.querySelector(".dec");
      var inc = card.querySelector(".inc");
      if (dec) dec.onclick = function (e) { e.stopPropagation(); changeQty(p.id, -1); };
      if (inc) inc.onclick = function (e) { e.stopPropagation(); changeQty(p.id, 1); };
      el.appendChild(card);
    });
  }

  function changeQty(productId, delta) {
    var current = state.cart[productId] || 0;
    var next = Math.max(0, current + delta);
    if (next === 0) delete state.cart[productId]; else state.cart[productId] = next;
    if (currentView() === "grid") renderGrid();
    if (currentView() === "cart") render();
    updateMainButton();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

    api("/api/cart/set_qty", { method: "POST", body: JSON.stringify({ product_id: productId, quantity: next }) })
      .then(function (r) {
        if (r.ok && r.data.quantity > 0) state.cart[productId] = r.data.quantity;
        else if (r.ok) delete state.cart[productId];
        if (currentView() === "grid") renderGrid();
        if (currentView() === "cart") render();
        updateMainButton();
      });
  }

  function cartCount() { return Object.keys(state.cart).reduce(function (a, k) { return a + state.cart[k]; }, 0); }
  function cartSubtotal() {
    var total = 0;
    Object.keys(state.cart).forEach(function (pid) {
      var p = state.products.filter(function (x) { return x.id === Number(pid); })[0];
      if (p) total += p.price * state.cart[pid];
    });
    return total;
  }
  function cartTotalAfterDiscount() {
    return Math.max(cartSubtotal() - (state.checkout.discount_amount || 0), 0);
  }

  // ---------- MainButton ----------
  function updateMainButton() {
    if (!tg) return;
    var view = currentView();
    if (view === "detail" && state.detailProduct) {
      var qty = state.cart[state.detailProduct.id] || 0;
      tg.MainButton.setText(qty > 0 ? ("✅ Savatda: " + qty + " ta — yana qo'shish") : "➕ Savatga qo'shish");
      tg.MainButton.show();
    } else if (view === "cart") {
      var count = cartCount();
      if (count > 0) { tg.MainButton.setText("✅ Buyurtma berish — " + fmtPrice(cartSubtotal()) + " so'm"); tg.MainButton.show(); }
      else tg.MainButton.hide();
    } else if (view === "checkout_form") {
      tg.MainButton.setText("Davom etish"); tg.MainButton.show();
    } else if (view === "checkout_promo") {
      tg.MainButton.setText("Davom etish"); tg.MainButton.show();
    } else if (view === "checkout_success") {
      tg.MainButton.setText("Davom etish"); tg.MainButton.show();
    } else if (view === "topup_form") {
      tg.MainButton.setText("💳 So'rov yuborish"); tg.MainButton.show();
    } else if (view === "grid") {

  // Tarmoq so'rovi ketayotganda MainButton'ni "band" deb belgilaymiz - bu
  // ikki narsa uchun kerak: (1) foydalanuvchi tugmani qayta-qayta bosib,
  // bitta buyurtmani ikki marta yubormasligi uchun, (2) Telegram'ning o'z
  // "aylanuvchi" indikatorini ko'rsatib, sekin (masalan Render uxlab
  // qolgandan keyingi birinchi) so'rov paytida ekran "muzlab qolgandek"
  // ko'rinmasligi uchun.
  var mainBtnBusy = false;
  function withMainButtonProgress(fn) {
    if (mainBtnBusy) return;
    mainBtnBusy = true;
    if (tg) tg.MainButton.showProgress(true);
    // DIQQAT (muhim tuzatish): agar `fn()` ichida kutilmagan xato chiqsa
    // (masalan biror DOM elementi topilmasa) va u avvalgidek `.catch()`siz
    // qolsa - Promise "rad etiladi" (rejected), pastdagi `.then()` HECH
    // QACHON ishlamay qoladi, demak `mainBtnBusy` abadiy `true` bo'lib
    // qolib, ENDI tugma umuman bosilmay qo'yadi (har qanday keyingi bosish
    // "band" deb hisoblanib, hatto xato ham chiqarmasdan, e'tiborsiz
    // qoldiriladi) - xuddi "tugma ishlamayapti" degan shikoyatga sabab
    // bo'lgan holat shu edi. `fn()`ning o'zi HAM (promise qaytarishdan oldin)
    // SINXRON xato berishi mumkinligi uchun (masalan DOM o'qishda), uni ham
    // try/catch bilan o'raymiz - aks holda o'sha holatda `Promise.resolve(...)`
    // qatoriga yetib ham bormay, `mainBtnBusy` baribir abadiy band qolar edi.
    var result;
    try {
      result = fn();
    } catch (err) {
      result = Promise.reject(err);
    }
    Promise.resolve(result)
      .catch(function (err) {
        console.error("withMainButtonProgress xatolik:", err);
        showToast("Kutilmagan xatolik yuz berdi. Qaytadan urinib ko'ring.");
      })
      .then(function () {
        mainBtnBusy = false;
        if (tg) tg.MainButton.hideProgress();
      });
  }

  if (tg) {
    tg.MainButton.onClick(function () {
      // Bu yerda ham himoya qatlami: quyidagi funksiyalarning ba'zilari
      // (masalan submitCheckoutForm) sinxron ishlaydi va DOM'dan
      // to'g'ridan-to'g'ri o'qiydi - agar kutilmagan sabab bilan xato
      // chiqsa, avval bu butunlay "jim" qolib ketardi (hech narsa
      // bosilmagandek tuyulardi). Endi bunday holatda ham foydalanuvchiga
      // kamida bitta tushunarli xabar chiqadi.
      try {
        var view = currentView();
        if (mainBtnBusy) return;
        if (view === "detail" && state.detailProduct) { changeQty(state.detailProduct.id, 1); }
        else if (view === "cart") { withMainButtonProgress(beginCheckout); }
        else if (view === "checkout_form") { submitCheckoutForm(); }
        else if (view === "checkout_promo") { withMainButtonProgress(submitPromoStep); }
        else if (view === "checkout_success") { resetToGrid(); }
        else if (view === "topup_form") { withMainButtonProgress(submitTopupForm); }
        else if (view === "grid" && state.mainTab === "katalog") { pushView("cart"); }
        else if (view === "grid" && state.mainTab === "custom") { withMainButtonProgress(submitCustomOrderForm); }
        else if (view === "grid" && state.mainTab === "profile") { withMainButtonProgress(submitProfileForm); }
      } catch (err) {
        console.error("MainButton bosilganda kutilmagan xatolik:", err);
        showToast("Kutilmagan xatolik yuz berdi. Qaytadan urinib ko'ring.");
      }
    });
  }

      var idx = Math.round(gallery.scrollLeft / gallery.clientWidth);
      dots.forEach(function (d, i) { d.classList.toggle("active", i === idx); });
    });
  }

  // QAYTA SO'RAMASDAN darhol keyingi bosqichga o'tardi - bu ba'zi
  // foydalanuvchilarga "manzil so'ramadi" bo'lib tuyuldi. Endi bu oraliq
  // ekran OLIB TASHLANDI: buyurtma berishda HAR DOIM ism/telefon/manzil

  function showPromoResult(valid, percent, amount, code) {
    var el = document.getElementById("p-result");
    if (!el) return;
    if (valid) {
      el.className = "promo-result ok";
      el.textContent = "✅ \"" + code + "\" qabul qilindi: -" + percent + "% (−" + fmtPrice(amount) + " so'm)";
    } else {
      el.className = "promo-result bad";
      el.textContent = "❌ Bu promo-kod topilmadi yoki muddati o'tgan.";

  function checkPromoCode() {
    var code = document.getElementById("p-code").value.trim().toUpperCase();
    if (!code) {
      state.checkout.promo_code = null;
      state.checkout.discount_percent = 0;
      state.checkout.discount_amount = 0;
      var el = document.getElementById("p-result");
      if (el) { el.className = "promo-result"; el.textContent = ""; }
      return;
    }
    api("/api/promo/check", { method: "POST", body: JSON.stringify({ code: code }) }).then(function (r) {
      if (r.ok && r.data.valid) {
        state.checkout.promo_code = r.data.code;
        state.checkout.discount_percent = r.data.discount_percent;
        state.checkout.discount_amount = r.data.discount_amount;
        showPromoResult(true, r.data.discount_percent, r.data.discount_amount, r.data.code);
      } else {
        state.checkout.promo_code = null;
        state.checkout.discount_percent = 0;
        state.checkout.discount_amount = 0;
        showPromoResult(false);
      }
    });
  }

  function submitPromoStep() {
    var codeInput = document.getElementById("p-code");
    var typed = codeInput ? codeInput.value.trim().toUpperCase() : "";
    if (typed && typed !== state.checkout.promo_code) {
      return api("/api/promo/check", { method: "POST", body: JSON.stringify({ code: typed }) }).then(function (r) {
        if (r.ok && r.data.valid) {
          state.checkout.promo_code = r.data.code;
          state.checkout.discount_percent = r.data.discount_percent;
          state.checkout.discount_amount = r.data.discount_amount;
        } else {
          state.checkout.promo_code = null;
          state.checkout.discount_percent = 0;
          state.checkout.discount_amount = 0;
        }
        return loadProfile().then(function () { pushView("checkout_payment"); });

      return loadProfile().then(function () { pushView("checkout_payment"); });

  function setPaymentButtonsDisabled(disabled) {
    ["pay-balance", "pay-card", "pay-cash"].forEach(function (id) {

      if (b) b.disabled = disabled;
    });

  function showPayError(text) {
    var el = document.getElementById("pay-error");
    if (!el) return;
    el.textContent = text;
    el.classList.remove("hidden");
  }

  var ERROR_MESSAGES = {
    empty_cart: "Savatingiz bo'sh qolgan.",
    insufficient_balance: "Hamyoningizda mablag' yetarli emas.",
    invalid_input: "Ism/telefon/manzil to'ldirilmagan.",
    card_unavailable: "Karta orqali to'lov hozircha sozlanmagan.",
    invoice_failed: "To'lov oynasini ochib bo'lmadi.",
  };

  function submitCheckout(method) {
    setPaymentButtonsDisabled(true);
    var body = {
      full_name: state.checkout.full_name,
      phone: state.checkout.phone,
      address: state.checkout.address,
      promo_code: state.checkout.promo_code || null,
      payment_method: method,
    };
    api("/api/checkout", { method: "POST", body: JSON.stringify(body) }).then(function (r) {
      if (!r.ok) {
        setPaymentButtonsDisabled(false);
        showPayError(ERROR_MESSAGES[r.data && r.data.error] || "Xatolik yuz berdi. Qaytadan urinib ko'ring.");
        if (r.data && r.data.error === "insufficient_balance") loadProfile().then(function () { if (currentView() === "checkout_payment") render(); });
        return;
      }
      // Server buyurtmani yaratgan zahoti savatni allaqachon tozalagan
      // (to'lov natijasidan qat'i nazar) - shu bilan mos holda darhol
      // mahalliy holatni ham tozalaymiz, aks holda katalog/savat ko'rinishi
      // serverdan uzilib qoladi.
      state.cart = {};
      if (r.data.status === "awaiting_payment" && r.data.invoice_link) {
        if (!tg) { setPaymentButtonsDisabled(false); showPayError("To'lovni faqat Telegram ilovasi ichida amalga oshirish mumkin."); return; }
        tg.openInvoice(r.data.invoice_link, function (status) {
          setPaymentButtonsDisabled(false);
          if (status === "paid") {
            showCheckoutSuccess(r.data.order_id, true);
          } else {
            showPayError("To'lov amalga oshmadi (holat: " + status + "). Buyurtma #" + r.data.order_id + " \"to'lov kutilmoqda\" holatida - qaytadan urinib ko'rishingiz yoki boshqa usulni tanlashingiz mumkin.");
          }
        });
      } else if (r.data.status === "confirmed") {
        showCheckoutSuccess(r.data.order_id, false);
      }
    }).catch(function () {
      setPaymentButtonsDisabled(false);
      showPayError("Tarmoq xatosi. Qaytadan urinib ko'ring.");
    });
  }

    var f = state.customForm;
    var description = document.getElementById("custom-desc").value.trim();
    var full_name = document.getElementById("custom-name").value.trim();
    var phone = document.getElementById("custom-phone").value.trim();
    var address = document.getElementById("custom-address").value.trim();
    var errEl = document.getElementById("custom-error");
    var problems = [];
    if (!f.photo) problems.push("rasm tanlang");
    if (description.length < 3) problems.push("tavsifni yozing");
    if (full_name.length < 2) problems.push("ismingizni yozing");
    if (phone.length < 7) problems.push("telefon raqamni to'g'ri kiriting");
    if (address.length < 3) problems.push("manzilni kiriting");
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return Promise.resolve();
    }
    errEl.classList.add("hidden");
    return api("/api/custom_order", {
      method: "POST",
      body: JSON.stringify({ photo: f.photo, description: description, full_name: full_name, phone: phone, address: address }),
    }).then(function (r) {
      if (r.ok) {
        showToast("✅ So'rovingiz qabul qilindi!");
        state.customForm = { photo: null, description: "", full_name: full_name, phone: phone, address: address };
        switchMainTab("katalog");
      } else {
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

  // ---------- Buyurtmalarim (tab) ----------
  var ORDER_STATUS_LABELS = {
    "yangi": "🕓 Kutilmoqda", "qabul qilindi": "✅ Qabul qilindi",
    "tayyorlanmoqda": "🛠 Tayyorlanmoqda", "yetkazildi": "📦 Yetkazildi",
    "to'lov kutilmoqda (karta)": "💳 To'lov kutilmoqda",
    "to'landi (karta)": "💳 To'landi (karta)", "to'landi (hamyondan)": "💰 To'landi (hamyondan)",
  };

  function renderOrdersTab(el) {
    el.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
    api("/api/orders").then(function (r) {
      if (state.mainTab !== "orders") return; // shu orada boshqa tabga o'tib ulgurgan bo'lishi mumkin
      if (!r.ok) { el.innerHTML = '<div class="empty">Yuklab bo\'lmadi.</div>'; return; }
      var orders = r.data.orders || [];
      if (!orders.length) {
        el.innerHTML = '<div class="empty">Sizda hali buyurtmalar yo\'q. Katalogdan mahsulot tanlab, birinchi buyurtmangizni bering!</div>';
        return;
      }
      el.innerHTML = '<div class="screen-title" style="margin-top:14px">📦 Buyurtmalaringiz</div>' + orders.map(function (o) {
        var items = [];
        try { items = JSON.parse(o.items_json); } catch (e) {}
        var itemsText = items.map(function (i) { return i.name + " x" + i.quantity; }).join(", ");
        return (
          '<div class="order-card">' +
            '<div class="oc-title">#' + o.id + ' — ' + fmtPrice(o.total_price) + " so'm</div>" +
            '<div class="oc-line">' + escapeHtml(itemsText) + '</div>' +
            '<div class="oc-line">Holat: ' + (ORDER_STATUS_LABELS[o.status] || escapeHtml(o.status)) + '</div>' +
          '</div>'
        );
      }).join("");
    });
  }

  // ---------- Profil (tab) ----------
  function renderProfileTab(el) {
    el.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
    loadProfile().then(function () {
      if (state.mainTab !== "profile") return;
      var pr = state.profile || {};
      el.innerHTML =
        '<div class="screen-title" style="margin-top:14px">👤 Profil</div>' +
        '<div class="profile-box"><div style="color:var(--hint);font-size:12.5px">Hamyon balansi</div>' +
          '<div class="profile-balance">' + fmtPrice(pr.balance || 0) + " so'm</div>" +
          '<button class="option-btn" id="topup-btn" style="margin-top:10px">💰 Hisobni to\'ldirish</button>' +
        '</div>' +
        '<div class="form-group"><label class="form-label">Ism-familiya</label><input class="form-input" id="pf-name" value="' + escapeHtml(pr.full_name || "") + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefon</label><input class="form-input" id="pf-phone" value="' + escapeHtml(pr.phone || "") + '" type="tel"></div>' +
        '<div class="form-group"><label class="form-label">Manzil</label><input class="form-input" id="pf-address" value="' + escapeHtml(pr.address || "") + '"></div>' +
        '<div class="form-error hidden" id="pf-error"></div>' +
        '<button class="page-cta" id="profile-save-btn">💾 Saqlash</button>' +
        '<div class="section-title">☎️ Aloqa</div>' +
        '<div class="profile-box" style="white-space:pre-wrap;font-size:13.5px">' + escapeHtml(state.contactInfo) + '</div>';
      document.getElementById("topup-btn").onclick = function () { pushView("topup_form"); };
      document.getElementById("profile-save-btn").onclick = function () { withMainButtonProgress(submitProfileForm); };
    });
  }

  function submitProfileForm() {
    var full_name = document.getElementById("pf-name").value.trim();
    var phone = document.getElementById("pf-phone").value.trim();
    var address = document.getElementById("pf-address").value.trim();
    var errEl = document.getElementById("pf-error");
    var problems = [];
    if (full_name.length < 2) problems.push("ismingizni yozing");
    if (phone.length < 7) problems.push("telefon raqamni to'g'ri kiriting");
    if (address.length < 3) problems.push("manzilni kiriting");
    if (problems.length) {
      errEl.textContent = "Iltimos: " + problems.join(", ") + ".";
      errEl.classList.remove("hidden");
      return Promise.resolve();
    }
    errEl.classList.add("hidden");
    return api("/api/profile", {
      method: "POST",
      body: JSON.stringify({ full_name: full_name, phone: phone, address: address }),
    }).then(function (r) {
      if (r.ok) {
        showToast("✅ Saqlandi");
        state.profile = Object.assign({}, state.profile, { full_name: full_name, phone: phone, address: address });
      } else {
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

  // ---------- Hisobni to'ldirish (profil ichidan ochiladigan overlay) ----------
  VIEW_RENDERERS.topup_form = function (el) {
    var f = state.topupForm;
    el.innerHTML =
      '<div class="screen">' +
        '<div class="screen-title">💰 Hisobni to\'ldirish</div>' +
        '<div class="form-group"><label class="form-label">Summasi (so\'m)</label>' +
          '<input class="form-input" id="tp-amount" type="number" value="' + escapeHtml(String(f.amount || "")) + '" placeholder="masalan: 100000"></div>' +
        '<div class="summary-box" style="white-space:pre-wrap">' + escapeHtml(state.paymentInfo) + '</div>' +
        '<div class="form-group"><label class="form-label">Chek skrinshoti (ixtiyoriy)</label>' +
          '<div id="tp-photo-preview">' + (f.screenshot ? '<img src="' + f.screenshot + '" style="width:100%;border-radius:12px">' : '') + '</div>' +
          '<button class="option-btn" id="tp-photo-btn" style="margin-top:8px">' + (f.screenshot ? "🔄 Boshqa rasm" : "📎 Skrinshot biriktirish") + '</button>' +
          '<input type="file" id="tp-photo-input" accept="image/*" style="display:none"></div>' +
        '<div class="form-error hidden" id="tp-error"></div>' +
        '<button class="page-cta" id="topup-submit-btn">💳 So\'rov yuborish</button>' +
      '</div>';
    document.getElementById("topup-submit-btn").onclick = function () { withMainButtonProgress(submitTopupForm); };
    document.getElementById("tp-photo-btn").onclick = function () { document.getElementById("tp-photo-input").click(); };
    document.getElementById("tp-photo-input").onchange = function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        f.screenshot = reader.result;
        document.getElementById("tp-photo-preview").innerHTML = '<img src="' + f.screenshot + '" style="width:100%;border-radius:12px">';
        document.getElementById("tp-photo-btn").textContent = "🔄 Boshqa rasm";
      };
      reader.readAsDataURL(file);
    };
  };

  function submitTopupForm() {
    var amountStr = document.getElementById("tp-amount").value.trim();
    var amount = parseInt(amountStr, 10);
    var errEl = document.getElementById("tp-error");
    if (!amount || amount <= 0) {
      errEl.textContent = "Iltimos, to'g'ri summa kiriting.";
      errEl.classList.remove("hidden");
      return Promise.resolve();
    }
    errEl.classList.add("hidden");
    var body = { amount: amount };
    if (state.topupForm.screenshot) body.screenshot = state.topupForm.screenshot;
    return api("/api/topup", { method: "POST", body: JSON.stringify(body) }).then(function (r) {
      if (r.ok) {
        showToast("✅ So'rovingiz yuborildi");
        state.topupForm = { amount: "", screenshot: null };
        popView();
        loadProfile().then(function () {
          if (state.mainTab === "profile") renderProfileTab(document.getElementById("tabcontent"));
        });
      } else {
        errEl.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
        errEl.classList.remove("hidden");
      }
    });
  }

  // ---------- Boshlash ----------
  renderBottomNav();
  loadCatalog()
    .then(function () {
      activeCategory = state.categories[0] || null;
      renderTabs(); renderGrid();
      return Promise.all([loadCart(), loadConfig()]);
    })
    .then(function () { renderGrid(); updateMainButton(); })
    .catch(function () {
      document.getElementById("grid").innerHTML = '<div class="empty">Yuklashda xatolik yuz berdi. Iltimos, qayta urinib ko\'ring.</div>';
    });
})();
</script>
</body>
</html>
